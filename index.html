<script>
/* Pick light or dark before anything shows, so there is no flash. */
(function(){try{var t='auto',a=localStorage.getItem('schedulebuddy2'),b=localStorage.getItem('scheduleBuddyGameState');
  if(a)t=(JSON.parse(a).set||{}).theme||'auto';else if(b&&JSON.parse(b).darkMode)t='dark';
  if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ───────── COLORS ───────── */
:root{
  --navline:#fffaf0;
  --ink:#1b2340; --paper:#f6efdd; --card:#fffaf0; --well:#e9dfc8; --txt:#1b2340; --sub:#55607e;
  --teal:#2aa7a1; --coral:#f2706b; --butter:#ffd75e; --grass:#6fbf5f;
  --pix:'Jersey 15','Avenir Next Condensed','DIN Condensed','Arial Narrow',sans-serif; --body:'Nunito','Trebuchet MS','Segoe UI',sans-serif;
  /* Breathing room at the screen edges. st0 is the phone's own safe area at the top; st and sb add extra space on top of the phone's own. */
  --st0:env(safe-area-inset-top,0px);
  --st:calc(env(safe-area-inset-top,0px) + 12px);
  --sb:calc(max(env(safe-area-inset-bottom,0px), 10px) + 6px);
}
:root[data-theme="dark"]{ --navline:#0b1022; --paper:#141a30; --card:#1f2745; --well:#2a3358; --txt:#f3ecd8; --sub:#aab3d0; --ink:#0b1022; }

/* ───────── BASE ───────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
[hidden]{display:none!important;}
html,body{height:100%;overscroll-behavior:none;}
html{background:var(--paper);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{overflow:hidden;background:var(--paper);color:var(--txt);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select{font:inherit;font-size:16px;color:inherit;}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;position:relative;}
.tabs{flex:1;position:relative;overflow:hidden;}
.tab{position:absolute;inset:0;display:none;flex-direction:column;}
.tab.on{display:flex;}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + var(--st)) 16px 24px;}
h1{font-family:var(--pix);font-weight:400;font-size:36px;line-height:1;}
h2{font-family:var(--pix);font-weight:400;font-size:26px;line-height:1.05;}
.lbl{display:block;font-weight:800;font-size:14px;color:var(--sub);margin:18px 2px 8px;}
.note{font-size:14px;color:var(--sub);}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:14px;}

/* ───────── BUTTONS ───────── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:var(--pix);font-size:25px;line-height:1.1;color:#1b2340;background:var(--butter);border:3px solid var(--ink);border-radius:10px;padding:10px 16px;box-shadow:0 5px 0 var(--ink);transition:transform .05s,box-shadow .05s;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.btn.b{background:var(--teal);color:#fffaf0;} .btn.p{background:#6a5a9c;color:#fffaf0;} .btn.c{background:var(--card);color:var(--txt);} .btn.d{background:var(--coral);}
.btn.sm{width:auto;font-size:21px;padding:6px 12px;box-shadow:0 4px 0 var(--ink);border-radius:9px;}
.btn.sm:active{transform:translateY(3px);}
.icb{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;box-shadow:0 3px 0 var(--ink);font-family:var(--pix);font-size:26px;line-height:1;}
.icb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
.icb[disabled]{opacity:.35;pointer-events:none;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{flex:1;min-width:0;font-family:var(--pix);font-size:21px;line-height:1.1;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;padding:7px 6px;box-shadow:0 4px 0 var(--ink);white-space:nowrap;}
.seg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.seg button.on{background:var(--butter);color:#1b2340;}
.field{width:100%;height:50px;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:10px;padding:0 12px;outline:none;font-weight:700;-webkit-appearance:none;appearance:none;}
.field:focus{border-color:var(--coral);}

/* ───────── NAV ───────── */
.nav{display:flex;background:var(--card);position:relative;z-index:5;}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 calc(6px + var(--sb));font-family:var(--pix);font-size:17px;line-height:1;color:var(--txt);}       /* the safe space is inside each button, so the selected color runs to the very bottom */
.nav button.on{background:var(--butter);color:#1b2340;}
.nav canvas{width:28px;height:28px;}

/* ───────── TODAY: sky, header, timeline ───────── */
#t-today{background:#7fc0f0;}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.sky canvas{position:absolute;width:42px;height:42px;}
.star{position:absolute;width:3px;height:3px;background:#fffdf5;}
.top{position:relative;z-index:3;padding:calc(10px + var(--st)) 12px 8px;display:flex;flex-direction:column;gap:8px;}
.toprow{display:flex;align-items:center;gap:8px;}
.toprow .btn{margin-left:auto;flex-shrink:0;}
.chips{display:flex;gap:7px;min-width:0;}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;box-shadow:3px 3px 0 var(--ink);padding:2px 8px 2px 5px;font-family:var(--pix);font-size:23px;line-height:1.15;white-space:nowrap;}
.chip.bump{animation:bump .35s ease;}
@keyframes bump{40%{transform:translateY(-5px) scale(1.08)}}
.daybar{display:flex;align-items:center;gap:8px;}
.daybar .title{flex:1;min-width:0;text-align:center;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;box-shadow:0 3px 0 var(--ink);height:40px;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:23px;line-height:1;white-space:nowrap;overflow:hidden;}
.scroll{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch;}
/* tasks with no set time drift above the house as small clouds, three to a row, outlined like every other box */
.any{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:30px 0;padding:38px 14px 14px;align-items:start;}
.any .blk{position:relative;width:auto;min-height:42px;border:none;border-radius:0;box-shadow:none;background:none!important;overflow:visible;animation:drift 7s ease-in-out infinite alternate;will-change:transform;width:86%;justify-self:center;}
.any .blk{grid-column:span 2;}
.any .blk:nth-child(3n+2){margin-top:9px;}
/* a last row with one or two clouds: they sit under the gaps between the clouds above, until a third arrives and the row evens out */
.any .blk:nth-child(3n+1):last-child{grid-column:2 / span 2;}
.any .blk:nth-child(3n+1):nth-last-child(2){grid-column:2 / span 2;}
.any .blk:nth-child(3n+2):last-child{grid-column:4 / span 2;margin-top:0;}
.cl{position:absolute;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;}       /* the cloud itself is pixel art, drawn to fit each task */
.any .blk-main,.any .chk{position:relative;z-index:1;}
.any .blk-main{padding:5px 0 5px 11px;}
.any .blk b{font-size:12.5px;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.any .blk small{font-size:11px;line-height:1.2;}
.any .chk{width:27px;justify-content:flex-start;}
.any .chk i{width:21px;height:21px;}
.any .blk.done .chk i::after{width:9px;height:4px;}
@keyframes drift{from{transform:translate3d(-4px,0,0)}to{transform:translate3d(4px,0,0)}}
.tl2{position:relative;margin-top:6px;}
.tl-rail{position:absolute;left:16px;top:0;bottom:0;width:4px;background:rgba(27,35,64,.3);}
.tl-tick{position:absolute;left:12px;width:12px;height:3px;background:rgba(27,35,64,.45);}
.tl-band{position:absolute;left:0;right:0;}
.tl-band.alt{background:rgba(255,255,255,.13);}
.night .tl-tick{background:rgba(243,236,216,.5);} .night .tl-band.alt{background:rgba(255,255,255,.05);}
.tl-hour{position:absolute;left:28px;font-family:var(--pix);font-size:19px;line-height:1;color:#1b2340;}
.night .tl-hour{color:#f3ecd8;} .night .tl-rail{background:rgba(243,236,216,.35);}
.blk{position:absolute;z-index:2;background:#fffaf0;color:#1b2340;border:3px solid #1b2340;border-radius:8px;box-shadow:3px 3px 0 #1b2340;display:flex;align-items:stretch;overflow:hidden;}
.blk-main{flex:1;min-width:0;padding:5px 4px 5px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center;}
.blk b{font-weight:800;font-size:15px;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.blk small{font-size:12.5px;color:#55607e;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.blk.tall b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}       /* tall boxes let a long name run onto a second line */
.blk.done{background:#d8f0c8;} .blk.now{background:#ffd75e;} .blk.late{background:#f6ddd6;} .blk.late small{color:#b3403d;}
.night .blk{border-color:#0b1022;box-shadow:3px 3px 0 #0b1022;}
.night .top .chip,.night .daybanner{border-color:#0b1022;box-shadow:3px 3px 0 #0b1022;}
.night .top .btn{border-color:#0b1022;box-shadow:0 4px 0 #0b1022;}
.night .top .btn:active{box-shadow:0 1px 0 #0b1022;}
.night .trayhint{border-color:#0b1022;box-shadow:0 4px 0 #0b1022;}
.night .empty .btn{border-color:#0b1022;box-shadow:0 5px 0 #0b1022;}
.chk{width:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.chk i{width:30px;height:30px;border:3px solid #1b2340;border-radius:50%;background:#fffaf0;display:flex;align-items:center;justify-content:center;transition:transform .08s;}
.chk:active i{transform:scale(.88);}
.blk.done .chk i{background:#6fbf5f;}
.blk.done .chk i::after{content:'';width:12px;height:6px;border-left:3px solid #1b2340;border-bottom:3px solid #1b2340;transform:rotate(-45deg) translate(1px,-1px);}
.nowline{position:absolute;left:0;right:0;z-index:1;height:3px;background:#f2706b;box-shadow:0 2px 0 #1b2340;}
.nowtag{position:absolute;z-index:3;left:8px;font-family:var(--pix);font-size:21px;line-height:1.15;background:#f2706b;color:#1b2340;border:3px solid #1b2340;border-radius:6px;padding:0 7px;}
.tl2 canvas{position:absolute;z-index:4;pointer-events:none;}
.tl2 canvas.hop{animation:hop .55s cubic-bezier(.3,.6,.4,1) 2;}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px)}}
.spark{position:absolute;z-index:5;width:6px;height:6px;background:#ffd75e;box-shadow:0 0 0 2px #1b2340;animation:spark .8s ease-out forwards;pointer-events:none;}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#homeWrap{position:relative;overflow-x:clip;}
.orb{position:absolute;width:42px;height:42px;z-index:-1;pointer-events:none;}       /* the sun and moon sit behind everything, and scroll with the house */      /* the grass is wider than the screen; this stops that extra width from making the page slide sideways */
#homeC{margin-top:6px;max-width:none;}
.daybanner{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;box-shadow:3px 3px 0 var(--ink);padding:5px 6px 7px 12px;font-family:var(--pix);font-size:23px;line-height:1;}
.daybanner span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.daybanner .btn.sm{font-size:19px;padding:4px 9px;}
.trayhint{position:absolute;right:12px;bottom:12px;z-index:6;display:flex;align-items:center;gap:7px;font-family:var(--pix);font-size:21px;line-height:1.1;color:#1b2340;background:#ffd75e;border:3px solid #1b2340;border-radius:9px;box-shadow:0 4px 0 #1b2340;padding:4px 10px;}
.trayhint i{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #1b2340;}
.emptywrap{position:sticky;top:calc(50% - 96px);z-index:6;height:0;display:flex;justify-content:center;}
.empty{width:220px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:40px;}
.empty h2{color:#fffdf5;font-size:32px;text-shadow:2px 2px 0 #1b2340;}
.empty .btn{font-size:22px;padding:8px 14px;width:auto;}

/* ───────── CALENDAR ───────── */
.calhead{display:flex;align-items:center;gap:8px;margin:14px 0 12px;}
.calhead .title{flex:1;text-align:center;font-family:var(--pix);font-size:27px;line-height:1;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal span{text-align:center;font-family:var(--pix);font-size:18px;color:var(--sub);line-height:1;}
.day{aspect-ratio:1;border:3px solid var(--ink);border-radius:8px;background:var(--card);color:var(--txt);font-family:var(--pix);font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.day.r5{background:#3d8a4e;color:#fffdf5;} .day.r4{background:#6fbf5f;color:#1b2340;} .day.r3{background:#ffd75e;color:#1b2340;} .day.r2{background:#f2a65a;color:#1b2340;} .day.r1{background:#f2706b;color:#1b2340;}
.day.off{border-color:transparent;background:none;color:var(--sub);opacity:.55;}
.day.plan{border-style:dashed;background:none;color:var(--txt);}
.day.today{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--coral);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.stat{text-align:center;padding:10px 4px;display:block;width:100%;}
button.stat:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
.stat b{display:block;font-family:var(--pix);font-weight:400;font-size:34px;line-height:1;}
.stat small{font-size:12.5px;font-weight:800;color:var(--sub);}
.legend{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:13px;font-weight:700;color:var(--sub);}
.legend i{width:16px;height:16px;border:2px solid var(--ink);border-radius:4px;}

/* ───────── SETTINGS / ADVENTURE ───────── */
.buds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.budpick{background:var(--card);border:3px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--ink);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;font-family:var(--pix);font-size:18px;line-height:1;color:var(--txt);}
.budpick.on{background:var(--butter);color:#1b2340;}
.budpick canvas{max-width:100%;}
.row{display:flex;align-items:center;gap:10px;}
.row > *{flex:1;min-width:0;}
.srow{display:flex;flex-direction:column;gap:10px;}
.adv{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}

/* ───────── ADVENTURE: map, fish book, fishing game ───────── */
#p-adv{padding:calc(10px + var(--st)) 12px 12px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;}          /* nothing here slides around under a finger */
#p-adv .toprow{margin-bottom:8px;}
.mapwrap{position:relative;padding:0;overflow:hidden;margin:0 auto;box-sizing:content-box;}
.pin{position:relative;}
#mapC{display:block;}
#mapBud{position:absolute;pointer-events:none;z-index:3;}
.spot{position:absolute;width:52px;height:52px;margin:-30px 0 0 -26px;border-radius:50%;z-index:4;}
.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bcell{background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:6px 4px 7px;text-align:center;min-width:0;}
.bcell b{display:block;font-family:var(--pix);font-weight:400;font-size:18px;line-height:1.05;margin-top:4px;}
.bcell small{display:block;font-size:11.5px;font-weight:700;color:var(--sub);line-height:1.3;margin-top:2px;}
.bcell.no{background:var(--well);}
.bcell.r2:not(.no){background:#d7ecf7;color:#1b2340;} .bcell.r3:not(.no){background:#ffe9a0;color:#1b2340;}
.bcell.r2:not(.no) small,.bcell.r3:not(.no) small{color:#55607e;}
.bimg{height:56px;display:flex;align-items:center;justify-content:center;}
.bimg.sm{height:auto;width:62px;flex-shrink:0;}
#game{position:fixed;inset:0;z-index:40;background:#1c6f78;touch-action:none;overflow:hidden;}
#gameC{width:100%;height:100%;}
#gHud{position:absolute;left:12px;top:calc(12px + var(--st));font-family:var(--pix);font-size:26px;line-height:1.1;color:#1b2340;background:#fffaf0;border:3px solid #1b2340;border-radius:9px;box-shadow:3px 3px 0 #1b2340;padding:2px 10px;white-space:pre;}
#gQuit{position:absolute;right:12px;top:calc(12px + var(--st));}
#gMsg{position:absolute;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);text-align:center;font-family:var(--pix);font-size:24px;line-height:1.1;color:#1b2340;background:#ffd75e;border:3px solid #1b2340;border-radius:9px;padding:3px 12px;opacity:0;transition:opacity .2s;pointer-events:none;}
#gMsg.on{opacity:1;}

/* ───────── HOME AND SHOP ───────── */
.view{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
.vhead{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--st)) 12px 10px;}
.vhead h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vhead.shop{padding-top:8px;}
.shead{display:flex;align-items:center;gap:10px;}
#homeV .vhead{padding-bottom:8px;}
#awn{flex-shrink:0;margin-top:var(--st0);max-width:none;}
#shopV{background:linear-gradient(#b98455 0 var(--st0),var(--paper) var(--st0));}
#arcV{background:linear-gradient(#4c4078 0 var(--st0),var(--paper) var(--st0));}
.shopbody{flex:1;overflow-y:auto;padding:0 12px calc(20px + var(--sb));}
.roomwrap{position:relative;box-sizing:content-box;margin:0 auto;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;}
#roomC{display:block;}
.roombud{position:absolute;pointer-events:none;z-index:2;animation:roam 14s steps(28) infinite alternate;}
@keyframes roam{from{transform:translateX(-52%)}to{transform:translateX(52%)}}
.rslot{position:absolute;z-index:3;border-radius:8px;}
/* empty spots flash a ghost outline for a few seconds when you walk in */
.rslot.ghost::after{content:'+';position:absolute;inset:2px;border:2px dashed #1b2340;border-radius:7px;background:rgba(255,250,240,.3);display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:22px;line-height:1;color:#1b2340;animation:ghost 2.6s ease-in-out infinite;pointer-events:none;}
@keyframes ghost{50%{opacity:.5}}
.rslot:active{background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 2px #1b2340;}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.icard{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0;}
.icard.on{background:var(--butter);color:#1b2340;}
.ishelf{height:108px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;border-radius:7px;background:linear-gradient(var(--well) 0 calc(100% - 7px),#b98455 calc(100% - 7px) calc(100% - 3px),#77492f calc(100% - 3px));}
.icard b{font-family:var(--pix);font-weight:400;font-size:21px;line-height:1.05;}
.icard small{font-size:12.5px;font-weight:700;color:var(--sub);line-height:1.3;}
.icard.on small{color:#55607e;}
.pbtn{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--pix);font-size:21px;line-height:1.1;color:#1b2340;background:var(--butter);border:3px solid var(--ink);border-radius:8px;padding:4px 6px;box-shadow:0 3px 0 var(--ink);}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
.pbtn.no{background:var(--well);color:var(--sub);}
.pbtn.use{background:var(--teal);color:#fffaf0;}
.pbtn.cur{background:none;box-shadow:none;border-style:dashed;color:inherit;}
.pips{display:flex;gap:3px;}
.pips i{flex:1;max-width:14px;height:8px;border:2px solid var(--ink);border-radius:3px;background:var(--well);}
.pips i.on{background:var(--teal);}
.swrow{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
.swatch{aspect-ratio:1;border:3px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0;}
.swatch.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink);}
.swatch.lock{opacity:.55;}
.swatch span{font-family:var(--pix);font-size:15px;line-height:1;color:#1b2340;background:#fffaf0;border-radius:4px;padding:0 2px;}
.houseprev{border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#8fc8f0;}
.houseprev canvas{width:100%;height:auto;}
.sheet-box .lbl,.shopbody .lbl{margin:10px 2px 6px;}

/* ───────── ARCADE ───────── */
#marq{flex-shrink:0;margin-top:var(--st0);max-width:none;}
.arcshot{align-items:center;padding:0;overflow:hidden;border:3px solid var(--ink);height:auto;}
#arcDev{position:fixed;inset:0;z-index:45;background:#1b2340;display:flex;flex-direction:column;align-items:center;padding:calc(4px + var(--st0,0px)) 4px calc(4px + var(--sb));touch-action:none;-webkit-user-select:none;user-select:none;animation:viewIn .2s ease both;}
.console{flex:1;min-height:0;width:100%;max-width:520px;background:var(--tint,#bfe8e4);border:4px solid #1b2340;border-radius:22px 22px 56px 22px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;}
.ctop{align-self:stretch;display:flex;align-items:center;gap:8px;font-family:var(--pix);font-size:22px;line-height:1;color:#1b2340;}
.ctop .led{width:10px;height:10px;border-radius:50%;background:#f2706b;border:2px solid #1b2340;box-shadow:0 0 0 3px rgba(242,112,107,.3);}
.ctop .brand{margin-left:auto;font-size:16px;letter-spacing:1px;opacity:.7;white-space:nowrap;}
#arcName{white-space:nowrap;}
@media (max-width:350px){.ctop .brand{display:none;}}
#arcX{margin-right:4px;}
.bezel{background:#1b2340;border-radius:12px 12px 30px 12px;padding:9px 9px 13px;display:flex;justify-content:center;}
#arcC{display:block;border-radius:3px;background:#bfe8ff;}
.pads{flex:1;min-height:0;align-self:stretch;display:flex;align-items:center;justify-content:space-between;padding:0 8px;}
.dpad{display:grid;grid-template-columns:repeat(3,var(--pb,58px));grid-template-rows:repeat(3,var(--pb,58px));gap:0;}
.dpad button{background:#2c3766;color:#f4e9d0;font-family:var(--pix);font-size:40px;line-height:1;touch-action:none;border:4px solid #1b2340;box-shadow:0 5px 0 #0b1022;padding:0;display:flex;align-items:center;justify-content:center;}
.dpad i{grid-area:2/2;background:#2c3766;border-top:4px solid #2c3766;box-shadow:0 5px 0 #0b1022;}
#arcU{grid-area:1/2;border-radius:12px 12px 0 0;border-bottom:0;box-shadow:none;} #arcD{grid-area:3/2;border-radius:0 0 12px 12px;border-top:0;}
#arcL{grid-area:2/1;border-radius:12px 0 0 12px;border-right:0;} #arcR{grid-area:2/3;border-radius:0 12px 12px 0;border-left:0;}
#arcU span,#arcD span{display:block;transform:rotate(90deg);}
#arcA{width:var(--ab,92px);height:var(--ab,92px);border:4px solid #1b2340;border-radius:50%;background:#f2706b;color:#1b2340;font-family:var(--pix);font-size:42px;line-height:1;box-shadow:0 6px 0 #1b2340;touch-action:none;}
.dpad button.down{background:#1b2340;}
#arcA.down{transform:translateY(5px);box-shadow:0 1px 0 #1b2340;}
.grille{display:flex;gap:5px;transform:rotate(-24deg);}
.grille i{width:5px;height:30px;border-radius:3px;background:#1b2340;opacity:.55;}

/* ───────── SOUND SETTINGS ───────── */
.sndp{padding:10px 12px;display:flex;flex-direction:column;gap:10px;}
.sndr{display:flex;align-items:center;gap:10px;} .sndr b{flex:1;font-family:var(--pix);font-weight:400;font-size:22px;line-height:1;} .sndr .seg{width:150px;flex-shrink:0;margin:0;}
.sndp .note{margin:0;}

/* ───────── DRAW YOUR OWN ───────── */
#drawV{z-index:60;overflow:hidden;}
.dtop{display:flex;align-items:center;gap:12px;margin:0 12px 8px;}
.dprev{flex-shrink:0;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#8fc8f0;line-height:0;box-shadow:3px 3px 0 var(--ink);}
.dprev canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
.dwrap{flex:1;min-height:120px;display:flex;overflow:auto;margin:0 12px;background:var(--well);border:3px solid var(--ink);border-radius:12px;-webkit-overflow-scrolling:touch;}
#drawC{margin:auto;flex-shrink:0;touch-action:none;border:2px solid var(--ink);box-sizing:content-box;}
.dtools{display:flex;gap:6px;margin:8px 12px 0;}
.dt{flex:1;min-width:0;font-family:var(--pix);font-size:19px;line-height:1.1;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:8px;padding:6px 2px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;}
.dt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
.dt.on{background:var(--butter);color:#1b2340;}
.dt:disabled{opacity:.4;}
.dt[data-a="drawZoom"]{flex:.6;}
.dt[data-a="drawTpl"]{flex:2;}
.dpal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:10px 12px calc(10px + var(--sb));}
.dpal button{aspect-ratio:1;border:2px solid var(--ink);border-radius:6px;padding:0;min-width:0;}
.dpal button.on{outline:3px solid var(--butter);outline-offset:1px;transform:scale(1.12);z-index:1;position:relative;}
.drow{display:flex;gap:6px;margin-top:8px;}
.drow .pbtn{flex:1;margin-top:0;}

/* ───────── FISHING SPOT SCENE ───────── */
.spotscene{position:relative;flex:1;min-height:0;overflow:hidden;background:#8fc8f0;}
#spotC{position:absolute;top:0;max-width:none;}
.spotscene canvas{image-rendering:pixelated;image-rendering:crisp-edges;}
.spot-top{position:absolute;left:0;right:0;top:calc(12px + var(--st));text-align:center;padding:0 12px;z-index:2;}
.spot-top h2{font-size:42px;color:#fffdf5;text-shadow:3px 3px 0 #1b2340;}
.spot-top p{font-family:var(--pix);font-size:22px;line-height:1.1;color:#fffdf5;text-shadow:2px 2px 0 #1b2340;margin-top:4px;}
.spotrow{display:flex;gap:8px;justify-content:center;padding:10px 12px 0;}
.spotrow:empty{display:none;}
.spotbtns{display:flex;gap:10px;padding:10px 12px calc(6px + var(--sb));}
.spotbtns .btn{flex:1;font-size:28px;padding:12px 10px;}
.btn.cast{background:#f2706b;color:#1b2340;flex:1.5;}
.btn.ret{background:var(--teal);color:#fffaf0;}

/* ───────── BUDDY PROFILE, STARTER TASKS ───────── */
.pfp{width:41px;height:41px;flex-shrink:0;padding:0;border:3px solid var(--ink);border-radius:9px;background:#8fc8f0;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pfp:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.toprow.tight .chips{gap:4px;} .toprow.tight .chip{font-size:19px;gap:3px;padding:2px 5px 2px 3px;}       /* last resort when the numbers are very long on a narrow phone */
.toprow .pfp{margin-left:auto;} .toprow .pfp + .btn{margin-left:0;}
#p-adv .toprow .btn{padding-left:9px;padding-right:9px;}
.prof-top{display:flex;align-items:center;gap:14px;}
.profbud{flex-shrink:0;display:flex;justify-content:center;background:#8fc8f0;border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:4px 2px 0;}
.prof-id{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;}
.prof-id h2{font-size:34px;}
.bsts{display:flex;flex-direction:column;background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:2px 12px;}
.bst{display:grid;grid-template-columns:108px 1fr 44px;align-items:center;gap:8px;padding:10px 0;border-top:2px solid var(--well);text-align:left;width:100%;}
.bst:first-child{border-top:none;}
.bst-l{font-family:var(--pix);font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;}
.bst-v{font-family:var(--pix);font-size:21px;line-height:1;text-align:right;color:var(--sub);}
.bst small{grid-column:1 / -1;font-size:13px;font-weight:700;color:var(--sub);}
.sbar{display:flex;gap:3px;}
.sbar i{flex:1;height:14px;border:2px solid var(--ink);border-radius:3px;background:var(--well);}
.sbar.hi i.on{background:#6fbf5f;} .sbar.mid i.on{background:#ffd75e;} .sbar.lo i.on{background:#f2706b;} .sbar.na i.on{background:#aab3c4;} .sbar.fr i.on{background:#f08fb4;}
.starts{display:flex;flex-direction:column;gap:8px;}
.start{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--ink);padding:7px 12px;}
.start div{flex:1;min-width:0;}
.start b{display:block;font-weight:800;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.start small{display:block;font-size:13px;font-weight:700;color:var(--sub);}

.sheet-box > *{flex-shrink:0;}

<script>
'use strict';
/* ═════════ PIXEL ART ═════════ (palette, the painter, buddies, icons, the little house) */
/* ───────── palette ───────── */
const C={ink:'#1b2340',white:'#fffdf5',fog:'#d9dbe3',cream:'#f4e9d0',sand:'#e3c58f',dsand:'#c9a56c',
  grey:'#aab3c4',dgrey:'#7c869c',coal:'#2e3350',brown:'#9a6a45',dbrown:'#77492f',wood:'#b98455',
  orange:'#f2a65a',dorange:'#d9823b',butter:'#ffd75e',dbutter:'#e6b23a',coral:'#f2706b',dcoral:'#cf514f',pink:'#f7a8b0',
  teal:'#2aa7a1',deep:'#1c6f78',aqua:'#7fd6cf',sky:'#8fc8f0',blue:'#4b7fd1',dblue:'#3b4a7a',navy:'#2a3560',
  grass:'#6fbf5f',dgrass:'#3d8a4e',dusk:'#6a5a9c',peach:'#ffc9a3'};
const SHADE={[C.white]:C.fog,[C.cream]:C.sand,[C.sand]:C.dsand,[C.grey]:C.dgrey,[C.coal]:'#20243b',[C.brown]:C.dbrown,[C.wood]:C.brown,
  [C.orange]:C.dorange,[C.butter]:C.dbutter,[C.coral]:C.dcoral,[C.teal]:C.deep,[C.aqua]:C.teal,[C.sky]:C.blue,[C.blue]:C.dblue,
  [C.dblue]:C.navy,[C.grass]:C.dgrass,[C.dgrass]:'#2c6a3c',[C.pink]:C.coral,[C.fog]:C.grey,[C.dusk]:'#4c4078',[C.dorange]:'#b8652a'};

const SEAM={[C.white]:C.grey,[C.cream]:C.dsand,[C.fog]:C.dgrey};
function seamOf(c){return SEAM[c]||SHADE[SHADE[c]]||SHADE[c]||C.ink;}
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}

/* ───────── tiny pixel painter ───────── */
class Spr{
  constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null);}
  set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=c;return this;}
  get(x,y){return (x<0||y<0||x>=this.w||y>=this.h)?null:this.d[y*this.w+x];}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c);return this;}
  ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c);}return this;}
  line(x0,y0,x1,y1,c){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++)this.set(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c);return this;}
  rows(x,y,list,c){list.forEach((r,j)=>this.rect(x+r[0],y+j,r[1],1,c));return this;}      // list of [offset,width] per row
  shade(){const out=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const c=this.get(x,y);if(!c||!SHADE[c])continue;
    if(!this.get(x,y+1)||(!this.get(x+1,y)&&!this.get(x+1,y+1)))out[y*this.w+x]=SHADE[c];}this.d=out;return this;}
  outline(c){const o=new Spr(this.w,this.h);o.d=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(this.get(x,y))continue;
    if(this.get(x-1,y)||this.get(x+1,y)||this.get(x,y-1)||this.get(x,y+1))o.d[y*this.w+x]=c||C.ink;}return o;}
  blit(s,dx,dy){dx=dx||0;dy=dy||0;for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const c=s.get(x,y);if(c)this.set(x+dx,y+dy,c);}return this;}
  part(fn,noShade){const p=new Spr(this.w,this.h);fn(p);if(!noShade)p.shade();return this.blit(p.outline());}   // draw a piece, shade it, outline it, lay it on top
  lay(fn,noShade){                                  // like part(), but with no hard outline: where the new piece overlaps what is already there, it leaves a soft darker seam
    const p=new Spr(this.w,this.h);fn(p);if(!noShade)p.shade();
    for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(p.get(x,y)||!this.get(x,y))continue;
      if(p.get(x-1,y)||p.get(x+1,y)||p.get(x,y-1)||p.get(x,y+1))this.set(x,y,seamOf(this.get(x,y)));}
    return this.blit(p);}
  night(amt,keep){const o=new Spr(this.w,this.h);o.d=this.d.map(c=>(!c||keep.indexOf(c)>-1)?c:mix(c,'#141a3a',amt));return o;}
  recolor(map){const o=new Spr(this.w,this.h);o.d=this.d.map(c=>c&&map[c]?map[c]:c);return o;}       // swap exact colors, for furniture variants
  tint(c){const o=new Spr(this.w,this.h);o.d=this.d.map(v=>v?c:null);return o;}
  paint(cv){cv.width=this.w;cv.height=this.h;const g=cv.getContext('2d');g.clearRect(0,0,this.w,this.h);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const c=this.get(x,y);if(c){g.fillStyle=c;g.fillRect(x,y,1,1);}}return cv;}
}
function show(spr,scale,parent,label){
  const wrap=document.createElement('div'),cv=document.createElement('canvas');
  spr.paint(cv);cv.style.width=spr.w*scale+'px';cv.style.height=spr.h*scale+'px';wrap.appendChild(cv);
  if(label){const l=document.createElement('div');l.className='cap';l.textContent=label;wrap.appendChild(l);}
  parent.appendChild(wrap);return cv;
}

/* ───────── the buddies ───────── */
const CAT_EAR_L=[[2,2],[1,4],[1,5],[0,6],[0,6],[0,6],[1,5],[1,5]],CAT_EAR_R=[[2,2],[1,4],[0,5],[0,6],[0,6],[0,6],[0,5],[0,5]];     // narrow, round-tipped, and tucking in at the base
const CAT_IN_L=[[2,2],[2,3],[2,3]],CAT_IN_R=[[2,2],[1,3],[1,3]];
/* Second take. Bigger head and eyes, small body, soft seams inside, one dark outline around the whole shape. */
const B2W=50,B2H=46,B2X=7,B2Y=11;
function asleep(kind,bob){
  const S=new Spr(B2W,B2H),K={panda:C.white,cat:C.orange,otter:C.brown,penguin:C.dblue}[kind],by=bob?0.7:0;
  if(kind==='otter')S.lay(p=>{p.ell(42,42,5.4,2.2,C.brown);});
  if(kind==='penguin')S.lay(p=>{p.ell(41,43,3,1.5,C.orange);});
  S.lay(p=>{p.ell(29,38.4-by/2,13,5.8+by,K);
    if(kind==='penguin')p.ell(29,40.6,9,3.6,C.white);
    if(kind==='cat'){p.rect(29,33,1,4,C.dorange);p.rect(33,33,1,4,C.dorange);p.rect(37,34,1,3,C.dorange);}});
  if(kind==='panda')S.lay(p=>{p.ell(38.5,41.4,4,2.8,C.coal);p.ell(26,42.4,3.6,1.8,C.coal);});
  if(kind==='cat')S.lay(p=>{p.ell(36,42.2,8,2.2,C.orange);p.rect(33,41,1,3,C.dorange);p.rect(37,41,1,3,C.dorange);p.rect(41,41,1,3,C.dorange);});
  if(kind==='panda')S.lay(p=>{p.ell(8,27.6,3.4,3.4,C.coal);p.ell(23.4,26.8,3.4,3.4,C.coal);});
  if(kind==='otter')S.lay(p=>{p.ell(6,30.4,2.2,2.2,C.brown);p.ell(25.4,29.8,2.2,2.2,C.brown);});
  if(kind==='cat')S.lay(p=>{p.rows(7,21,CAT_EAR_L,C.orange);p.rows(19,20,CAT_EAR_R,C.orange);
    p.rows(7,23,CAT_IN_L,C.pink);p.rows(19,22,CAT_IN_R,C.pink);},true);
  S.lay(p=>{p.ell(16,35,10.6,8.6,K);
    if(kind==='cat'){p.rect(14,27,1,3,C.dorange);p.rect(16,27,1,3,C.dorange);p.rect(18,27,1,3,C.dorange);}
    if(kind==='otter')p.ell(15.6,39,7.8,4.4,C.cream);
    if(kind==='penguin'){p.ell(11.6,36.4,4.8,5.2,C.white);p.ell(20,36.4,4.8,5.2,C.white);p.ell(15.8,39.6,6.4,3,C.white);}
    if(kind==='panda'){p.ell(11,36.4,3.2,3.6,C.coal);p.ell(20.6,36.4,3.2,3.6,C.coal);}});
  const ec=kind==='panda'?C.white:C.ink;S.rect(9,37,3,1,ec);S.rect(19,37,3,1,ec);
  if(kind==='penguin'){S.rect(14,39,4,1,C.orange);S.rect(15,40,2,1,C.dorange);}

function over(base,fn){const p=new Spr(base.w,base.h);fn(p);for(let i=0;i<p.d.length;i++)if(p.d[i]&&base.d[i])base.d[i]=p.d[i];}    // paint a pattern only where the body already is
function fishSpr(f){
  const t=f.t||'fish';
  if(t==='fish'){
    const rx=f.rx,ry=f.ry,sn=f.snout||0,W=Math.ceil(rx*2+7+sn),H=Math.max(10,Math.ceil(ry*2+4+(f.sail?2:0))),S=new Spr(W,H),cx=1+sn+rx,cy=H/2+(f.sail?1:0);
    const B=new Spr(W,H),tx=Math.round(cx+rx-1.5),th=Math.max(4,Math.round(ry*2+(f.tail==='fan'?1:0)));
    for(let i=0;i<th;i++){const d=Math.abs(i-(th-1)/2)/((th-1)/2||1),yy=Math.round(cy-th/2)+i;
      if(f.tail==='fan')B.rect(tx,yy,4-Math.round(d*1.4),1,f.c3||f.c1);else if(f.tail==='thin')B.rect(tx,yy,d<0.5?5:0,1,f.c3||f.c1);else B.rect(tx+Math.round(d*d*2),yy,2+(d>0.25?1:0),1,f.c3||f.c1);}
    if(f.sail)B.rows(Math.round(cx-rx*0.5),Math.round(cy-ry-f.sail),Array.from({length:f.sail+1},(_,i)=>[Math.max(0,f.sail-i-1),Math.round(rx*0.9)+i]),f.c3||f.c2||f.c1);
    else B.rect(Math.round(cx-1),Math.round(cy-ry-1),Math.max(2,Math.round(rx*0.5)),2,f.c3||f.c1);
    if(sn)B.rect(1,Math.round(cy)-1,sn+2,2,f.c1);
    B.ell(cx,cy,rx,ry,f.c1);
    const pat=f.pat||'plain',c2=f.c2||C.white;
    over(B,p=>{
      if(pat==='belly')p.ell(cx-0.5,cy+ry*0.55,rx*0.8,ry*0.5,c2);
      if(pat==='back')p.ell(cx,cy-ry*0.6,rx*0.9,ry*0.5,c2);
      if(pat==='stripe')for(let x=cx-rx*0.45;x<cx+rx*0.8;x+=Math.max(2.4,rx*0.42))p.rect(Math.round(x),0,rx>7?2:1,H,c2);
      if(pat==='band'){p.rect(Math.round(cx-rx*0.35),0,2,H,c2);p.rect(Math.round(cx+rx*0.35),0,2,H,c2);}
      if(pat==='spots')[[-.4,-.3],[0,.2],[.35,-.25],[.5,.3],[-.1,-.5],[.15,.55]].forEach(q=>p.set(cx+q[0]*rx,cy+q[1]*ry,c2));
      if(pat==='patch'){p.ell(cx-rx*0.3,cy-ry*0.3,rx*0.3,ry*0.45,c2);p.ell(cx+rx*0.35,cy+ry*0.15,rx*0.3,ry*0.5,f.c4||c2);}
      if(pat==='rainbow')[C.coral,C.butter,C.grass,C.aqua,X.violet].forEach((c,i)=>p.rect(0,Math.round(cy-ry)+i*Math.max(1,Math.round(ry*2/5)),W,Math.max(1,Math.round(ry*2/5)),c));
      if(f.glow)for(let x=cx-rx*0.5;x<cx+rx*0.7;x+=2.6)p.set(x,cy+ry*0.35,f.glow);
    });
    B.shade();S.blit(B.outline());
    if(f.spike){[[-.6,-1.25],[-.1,-1.4],[.4,-1.25],[-.5,1.3],[.1,1.4]].forEach(q=>S.set(cx+q[0]*rx,cy+q[1]*ry,f.spike));}
    const ex=Math.round(cx-rx*0.6),ey=Math.round(cy-ry*0.3);
    const dark=f.darkEye;S.rect(ex,ey,2,2,dark?C.white:C.ink);S.set(dark?ex+1:ex,dark?ey+1:ey,dark?C.ink:C.white);
    if(f.whisk){S.set(ex-2,ey+3,C.ink).set(ex-3,ey+4,C.ink).set(ex,ey+4,C.ink);}
    if(f.teeth){S.rect(ex-1,ey+3,4,1,C.white);S.set(ex,ey+4,C.white).set(ex+2,ey+4,C.white);}
    if(f.lure){S.line(ex+2,ey-2,ex-1,1,C.ink).line(ex-1,1,ex-3,3,C.ink);S.rect(ex-4,3,2,2,f.lure);}
    return S;
  }
  if(t==='eel'){const W=30,H=12,S=new Spr(W,H);S.part(p=>{for(let i=0;i<=26;i++){const k=i/26;p.ell(3+k*24,6+Math.sin(k*Math.PI*2.2)*2.4,k<0.15?2.6:1.9-k*0.5,k<0.15?2.4:1.8-k*0.5,f.c1);}});
    if(f.c2)for(let i=3;i<24;i+=3)over(S,p=>p.set(4+i,6+Math.sin(i/26*Math.PI*2.2)*2.4,f.c2));
    S.rect(3,4,2,2,f.darkEye?C.white:C.ink);if(f.lure){S.line(5,3,8,0,C.ink);S.rect(8,0,2,2,f.lure);}if(f.teeth)S.rect(1,7,3,1,C.white);return S;}
  if(t==='ray'){const W=26,H=16,S=new Spr(W,H);S.part(p=>{p.rows(1,2,[[7,3],[5,7],[3,11],[1,14],[0,16],[0,16],[1,14],[3,11],[5,7],[7,3]],f.c1);p.rect(16,7,9,1,f.c1);if(f.c2)p.ell(8,7,4,3,f.c2);});S.rect(5,5,1,2,C.ink);S.rect(5,9,1,2,C.ink);return S;}
  if(t==='jelly'){const W=14,H=18,S=new Spr(W,H);S.part(p=>{p.ell(7,6,5.6,4.6,f.c1);p.rect(2,6,10,3,f.c1);[3,6,9].forEach((x,i)=>{for(let y=9;y<16-(i%2);y++)p.set(x+((y>>1)%2),y,f.c2||f.c1);});});S.set(4,4,C.white).set(5,3,C.white);return S;}
  if(t==='crab'){const W=20,H=13,S=new Spr(W,H);S.part(p=>{p.ell(10,8,5.6,3.6,f.c1);p.ell(3.5,4.5,2.4,2.2,f.c1);p.ell(16.5,4.5,2.4,2.2,f.c1);p.rect(5,6,2,2,f.c1);p.rect(13,6,2,2,f.c1);[4,6,14,16].forEach(x=>p.rect(x,11,1,2,f.c1));});
    S.rect(8,4,1,2,C.ink);S.rect(11,4,1,2,C.ink);S.set(3,4,null);S.set(16,4,null);if(f.c2){S.set(9,8,f.c2).set(11,9,f.c2).set(8,10,f.c2);}return S;}
  if(t==='squid'){const W=22,H=13,S=new Spr(W,H);S.part(p=>{p.rows(1,2,[[3,5],[1,9],[0,11],[0,11],[0,11],[0,11],[1,9],[3,5]],f.c1);[3,5,7,9].forEach((y,i)=>{for(let x=11;x<20-(i%2)*2;x++)p.set(x,y+((x>>1)%2),f.c2||f.c1);});});S.rect(8,4,2,2,C.white);S.set(9,5,C.ink);return S;}
  if(t==='star'){const W=15,H=15,S=new Spr(W,H);S.part(p=>{p.rows(0,0,[[7,1],[6,3],[6,3],[5,5],[0,15],[1,13],[3,9],[3,9],[3,9],[2,11],[2,4],[1,4],[1,3]],f.c1);p.rows(9,10,[[0,4],[1,4],[2,3]],f.c1);});S.set(6,6,C.ink).set(8,6,C.ink);[[7,3],[4,8],[10,8],[7,9]].forEach(q=>S.set(q[0],q[1],f.c2||C.white));return S;}
  if(t==='puff'){const S=new Spr(20,14);S.part(p=>{p.rows(14,3,[[2,2],[1,3],[0,3],[0,2],[0,2],[0,3],[1,3],[2,2]],f.c3||f.c1);p.ell(8.5,7,6,5.4,f.c1);p.ell(8.5,9.4,4.4,2.6,C.white);});
    [[4,1],[8,0],[12,1],[2,4],[14,5],[5,13],[11,13]].forEach(q=>S.set(q[0],q[1],f.c2||C.dbutter));S.rect(4,4,2,2,C.ink);S.set(4,4,C.white);return S;}
  if(t==='boot'){const S=new Spr(14,14);S.part(p=>{p.rect(4,1,5,8,C.brown);p.rect(4,8,9,4,C.brown);p.rect(4,1,5,1,C.wood);});S.rect(4,12,9,1,C.coal);return S;}
  if(t==='can'){const S=new Spr(10,14);S.part(p=>{p.rect(2,2,6,10,C.grey);p.rect(2,5,6,4,C.coral);},true);S.rect(2,2,6,1,C.fog);return S;}
  if(t==='bottle'){const S=new Spr(8,16);S.part(p=>{p.rect(3,1,2,4,C.grass);p.rect(1,5,6,9,C.grass);},true);S.rect(2,7,1,5,C.lime||X.lime);S.rect(3,0,2,1,C.wood);return S;}
  if(t==='chest'){const S=new Spr(18,14);S.part(p=>{p.rect(1,3,16,10,C.wood);p.rect(1,3,16,4,C.brown);},false);S.rect(1,7,16,1,C.dbrown);S.rect(8,6,2,3,X.gold);S.rect(3,3,1,10,C.dbutter);S.rect(14,3,1,10,C.dbutter);return S;}
  return new Spr(8,8);
}

/* ───────── the fishing game ─────────
   Drop: steer the hook down past the fish. Touch one and the drop ends. Reel: on the way up, steer INTO fish to hook them. */
const PPM=28;            // pixels per metre of depth
let G=null;
function startCast(id){
  const sp=SPOT[id];if(!sp||!S.spots[id])return;
  if(S.wallet.bait<1){toast('No bait');return;}
  const glow=!!(sheetCtx&&sheetCtx.glow)&&S.gear.glow>0;
  S.wallet.bait--;if(glow)S.gear.glow--;flush();sfx('cast');
  closeSheet();
  const el=$('game');el.hidden=false;const cv=$('gameC'),W=el.clientWidth,H=el.clientHeight;cv.width=W;cv.height=H;
  const reach=Math.min(LINE[S.gear.line-1],sp.depth);
  G={sp:sp,W:W,H:H,reach:reach*PPM,phase:'ready',t:0,x:W/2,tx:W/2,y:0,fish:[],caught:[],cap:HOOK[S.gear.hook-1],lure:10+S.gear.lure*3.5,steer:4.5+S.gear.reel*1.5,drop:150+S.gear.reel*14,asc:112,bumps:1,glow:glow,last:performance.now(),bub:[]};
  // stock the water: one thing roughly every 1.7 m, chosen from what lives at that depth
  let gotLegend=false;
  for(let d=1.6;d<reach-0.3;d+=1.25+Math.random()*0.9){
    if(d<reach*0.25&&Math.random()<0.5)continue;                 // thinner near the surface, so the drop gets going
    let pick=null;const roll=Math.random();
    if(roll<0.006*(glow?3:1)){pick=FISH.j_chest;}
    else if(roll<0.07){pick=JUNK[Math.floor(Math.random()*3)];}
    else{const pool=sp.fish.filter(f=>d>=f.d0&&d<=f.d1&&!(f.rar===3&&gotLegend));let tot=0;const w=pool.map(f=>{const x=RAR_W[f.rar]*(glow&&f.rar>=2?3:1);tot+=x;return x;});
      let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){pick=pool[i];break;}}
      if(pick&&pick.rar===3)gotLegend=true;}
    if(!pick)continue;
    const cvs=fishCanvas(pick.id),sc=pick.sc,dir=Math.random()<0.5?-1:1;
    G.fish.push({f:pick,x:20+Math.random()*(W-40),y:d*PPM,dir:dir,v:pick.v*(0.75+Math.random()*0.5),w:cvs.width*sc,h:cvs.height*sc,r:Math.max(cvs.width,cvs.height)*sc*0.36,ph:Math.random()*6,cv:cvs,dark:FDARK[pick.id],sc:sc});
  }
  $('gHud').textContent='';gameMsg('Dodge the fish on the way down');
  requestAnimationFrame(gameStep);
}
let gMsgT=null;
function gameMsg(t){const el=$('gMsg');el.textContent=t;el.classList.add('on');clearTimeout(gMsgT);gMsgT=setTimeout(()=>el.classList.remove('on'),1900);}
function gameStep(now){
  if(!G||G.phase==='done')return;
  const dt=Math.min(0.05,(now-G.last)/1000);G.last=now;G.t+=dt;
  if(G.phase==='ready'&&G.t>0.9)G.phase='drop';
  G.x+=(G.tx-G.x)*Math.min(1,G.steer*dt);G.x=Math.max(10,Math.min(G.W-10,G.x));
  const deep=G.y/(130*PPM);                                  // the deeper the hook, the faster the line runs, so long casts do not drag
  if(G.phase==='drop'){G.y+=G.drop*(1+deep*1.2)*dt;if(G.y>=G.reach){G.y=G.reach;G.phase='reel';gameMsg(G.reach<G.sp.depth*PPM?'Line ran out. Reel in and catch them!':'The bottom! Reel in and catch them!');}}
  else if(G.phase==='reel'){G.y-=G.asc*(1+deep*0.9)*(G.caught.length>=G.cap?2.6:1)*dt;if(G.y<=0){G.y=0;return gameEnd();}}
  G.fish.forEach(o=>{
    if(o.hooked)return;
    o.x+=o.dir*o.v*dt;if(o.x<-10){o.x=-10;o.dir=1;}if(o.x>G.W+10){o.x=G.W+10;o.dir=-1;}
    const dx=o.x-G.x,dy=o.y+Math.sin(G.t*2+o.ph)*3-G.y,dist=Math.hypot(dx,dy);
    if(G.phase==='drop'&&o.safe)return;
    if(G.phase==='drop'&&dist<o.r){
      if(G.bumps>0){G.bumps--;o.safe=true;o.dir=o.x<G.x?-1:1;o.v*=2.5;gameMsg('Bumped! One more touch ends the drop');sfx('bump');}          // the first touch on the way down is forgiven
      else{o.hooked=true;G.caught.push(o);G.phase='reel';gameMsg('Hooked one. Reel in and catch more!');sfx('hook');}
    }
    else if(G.phase==='reel'&&G.caught.length<G.cap&&dist<o.r+G.lure){o.hooked=true;G.caught.push(o);sfx('hook');}
  });
  drawGame();
  $('gHud').textContent=Math.round(G.y/PPM)+'m    '+G.caught.length+' / '+G.cap;
  requestAnimationFrame(gameStep);
}
function drawGame(){
  const cv=$('gameC'),g=cv.getContext('2d'),W=G.W,H=G.H,cam=G.y-H*0.38,sp=G.sp;g.imageSmoothingEnabled=false;
  const depthPx=sp.depth*PPM;
  for(let sy=0;sy<H;sy+=16){const wy=sy+cam;
    if(wy<0)g.fillStyle=skyAt(nowMin()/60);
    else if(wy>=depthPx)g.fillStyle=C.dsand;
    else g.fillStyle=mix(mix(sp.water[0],sp.water[1],Math.min(1,wy/depthPx)),'#070b1e',Math.min(0.55,wy/(130*PPM)*0.6));
    g.fillRect(0,sy,W,16);}
  const s0=-cam;                                             // where the surface is on screen
  if(s0>-20&&s0<H){g.fillStyle=C.white;for(let x=0;x<W;x+=12)g.fillRect(x+((G.t*14)%12),s0+(Math.floor(x/12)%2)*2,7,2);}
  if(depthPx-cam<H){g.fillStyle=C.sand;g.fillRect(0,depthPx-cam,W,4);}
  g.font='18px "Jersey 15",sans-serif';g.textBaseline='middle';
  for(let m=10;m<=sp.depth;m+=10){const sy=m*PPM-cam;if(sy<-10||sy>H+10)continue;g.fillStyle='rgba(255,255,255,.22)';for(let x=0;x<W;x+=14)g.fillRect(x,sy,7,2);g.fillStyle='rgba(255,255,255,.7)';g.fillText(m+'m',W-44,sy-10);}
  // the buddy on a little raft at the surface
  if(s0>-140){const b=buddyCanvas(),bw=B2W*2,bh=B2H*2,bx=W/2-bw/2-18,by=s0-bh*0.86;g.fillStyle=C.wood;g.fillRect(bx+6,s0-8,bw+4,8);g.fillStyle=C.brown;g.fillRect(bx+6,s0-2,bw+4,3);g.drawImage(b,bx,by,bw,bh);}

  g.strokeStyle=C.ink;g.lineWidth=2;g.beginPath();g.moveTo(W/2+26,Math.max(-10,s0-60));g.lineTo(G.x,G.y-cam);g.stroke();

  G.fish.forEach((o,i)=>{
    let x,y;
    if(o.hooked){const n=G.caught.indexOf(o);x=G.x+Math.sin(G.t*6+n)*4;y=G.y-cam+14+n*10;}
    else{x=o.x;y=o.y-cam+Math.sin(G.t*2+o.ph)*3;if(y<-60||y>H+60)return;}
    g.save();g.translate(Math.round(x),Math.round(y));if(o.hooked)g.rotate(Math.PI/2);else if(o.dir>0)g.scale(-1,1);
    if(o.y>50*PPM){g.shadowColor='rgba(170,225,255,.8)';g.shadowBlur=8;}                       // a pale glow in dark water, so dark fish can be seen
    g.drawImage(o.hooked?o.cv:(o.dark||o.cv),-o.w/2,-o.h/2,o.w,o.h);g.restore();            // just a dark shape until it is on the hook
  });
  // hook, with a ring showing how far it can grab on the way up
  const hx=Math.round(G.x),hy=Math.round(G.y-cam);
  if(G.phase==='reel'&&G.caught.length<G.cap){g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=2;g.setLineDash([4,5]);g.beginPath();g.arc(hx,hy,G.lure+8,0,Math.PI*2);g.stroke();g.setLineDash([]);}

  if(G.glow){g.fillStyle=X.gold;g.fillRect(hx-2,hy+11,6,5);}
}

/* ───────── 3. CARRY-OVER FROM THE FIRST SCHEDULEBUDDY ─────────
   The old data is read, never changed. Tasks and calendar history come across; the old level becomes a one-time coin gift. */
function looksOld(o){return !!o&&typeof o==='object'&&o.level!==undefined&&Array.isArray(o.tasks)&&!o.v;}
function migrateOld(o){
  const s=fresh(),t=today();s.migrated=true;
  const done=[];
  (o.tasks||[]).forEach(x=>{
    if(!x||!x.name)return;
    const id='t'+String(x.id||uid()),rec=!!x.recurring,start=parseHM(x.time);
    const tk=cleanTask({id:id,name:String(x.name),start:start,len:30,repeat:rec?'days':'once',days:Array.isArray(x.days)&&x.days.length?x.days:[0,1,2,3,4,5,6],date:t,created:t});
    if(!tk)return;s.tasks.push(tk);if(x.completed)done.push(id);
  });
  const hist=(o.dailyHistory&&typeof o.dailyHistory==='object')?o.dailyHistory:{},detail=(o.dailyTaskHistory&&typeof o.dailyTaskHistory==='object')?o.dailyTaskHistory:{};
  Object.keys(hist).forEach(k=>{const h=hist[k];if(isKey(k)&&k<t&&h&&h.total>0)s.log[k]={done:{},legacy:{done:Math.min(h.completed|0,h.total|0),total:h.total|0}};});
  Object.keys(detail).forEach(k=>{
    const arr=detail[k];if(!isKey(k)||k>=t||!Array.isArray(arr)||!arr.length)return;
    const lg=s.log[k]||(s.log[k]={done:{}});
    lg.snap=arr.filter(x=>x&&x.name).map(x=>({id:'t'+String(x.id),name:String(x.name).slice(0,60),start:parseHM(x.time),len:parseHM(x.time)==null?null:30}));
    arr.forEach(x=>{if(x&&x.completed)lg.done['t'+String(x.id)]={at:0,onTime:false,q:1};});
  });
  const keys=Object.keys(s.log).sort();s.since=keys[0]||t;
  if(done.length){const lg=s.log[t]={done:{}};done.forEach(id=>{lg.done[id]={at:Date.now(),onTime:false,q:1};});}
  s.bestStreak=Math.max(0,Math.floor(+o.bestStreak)||0);
  s.gift=Math.min(2500,Math.max(0,((Math.floor(+o.level)||1)-1)*25));s.wallet.coins=s.gift;
  s.set.theme=o.darkMode?'dark':'auto';
  S=s;if(S.log[t]){const e=dayEarn(t);S.log[t].coins=e.coins;S.log[t].bait=e.bait;S.log[t].tix=e.tix;}S.eco=5;   // today's old checkmarks are kept but not paid again
  return s;
}

/* ───────── 4. DAYS, TASKS AND REWARDS ───────── */
function liveTasksFor(k){
  const dow=dOf(k).getDay();
  return S.tasks.filter(t=>t.repeat==='once'?t.date===k:(t.days.includes(dow)&&t.created<=k&&(!t.ended||k<t.ended)));
}
/* Past days use the list that was frozen when the day ended, so later edits never rewrite history. */
function tasksFor(k){const lg=S.log[k];return (k<today()&&lg&&lg.snap)?lg.snap:liveTasksFor(k);}
function logW(k){return S.log[k]||(S.log[k]={done:{}});}
function dayInfo(k){
  const lg=S.log[k];
  if(lg&&lg.legacy&&!lg.snap)return rated({total:lg.legacy.total,done:lg.legacy.done,tasks:[]});
  const tasks=tasksFor(k),done=tasks.filter(t=>lg&&lg.done[t.id]).length;
  return rated({total:tasks.length,done:done,tasks:tasks});
}
function rated(i){const p=i.total?i.done/i.total:0;i.pct=p;i.rate=!i.total?0:p>=1?5:p>=0.75?4:p>=0.5?3:p>0?2:1;return i;}
const rewardable=k=>{const t=today();return k===t||k===addDays(t,-1);};
/* Works out what a day has earned so far and pays (or takes back) only the difference.
   Coins: 50 split across the day's tasks. Bait: one per on-time task. Tickets: for finishing everything. */
function dayEarn(k){
  const lg=logW(k),tasks=tasksFor(k),total=tasks.length,doneT=tasks.filter(t=>lg.done[t.id]);
  // coins: 5 per task. With more than 6 tasks in a day, each one pays a smaller equal share so that finishing them all still totals 30.
  const coins=total*TASK_COINS<=TASK_CAP?doneT.length*TASK_COINS:Math.floor(TASK_CAP*doneT.length/total);
  // on-time rewards, in the order tasks were finished: the first six alternate worm then ticket (three of each).
  // After that each task rolls once: 50% ticket, 20% worm, 30% nothing. The roll is kept, so unticking and re-ticking cannot change it.
  let baitN=0,tixN=0;
  doneT.filter(t=>lg.done[t.id].onTime).sort((a,b)=>(lg.done[a.id].at-lg.done[b.id].at)||(a.id<b.id?-1:1)).forEach((t,i)=>{
    if(i<ONTIME_CAP){if(i%2===0)baitN++;else tixN++;return;}
    lg.rx=lg.rx||{};if(!lg.rx[t.id]){const r=Math.random();lg.rx[t.id]=r<0.5?'t':r<0.7?'w':'n';}
    if(lg.rx[t.id]==='t')tixN++;else if(lg.rx[t.id]==='w')baitN++;});
  const full=total>0&&doneT.length===total;
  if(full)for(let i=total;i<ONTIME_CAP;i++){if(i%2===0)baitN++;else tixN++;}          // a day with fewer than six tasks: finishing it all pays the worms and tickets there were no tasks left to earn
  return {coins:coins+(full?DAY_BONUS:0),bait:baitN,tix:tixN+(full?DAY_TICKETS:0)};
}
/* Works out what a day has earned so far and pays (or takes back) only the difference. */
function settle(k){
  if(!rewardable(k))return;
  const lg=logW(k),e=dayEarn(k);
  S.wallet.coins=Math.max(0,S.wallet.coins+e.coins-(lg.coins||0));lg.coins=e.coins;
  S.wallet.bait=Math.max(0,S.wallet.bait+e.bait-(lg.bait||0));lg.bait=e.bait;
  S.wallet.tickets=Math.max(0,S.wallet.tickets+e.tix-(lg.tix||0));lg.tix=e.tix;
  frSettle(k);
}
/* Friendship. Each finished task is +1 and each missed task is -1, for today and yesterday.
   Progress toward the next level can drain back to empty, but a level that has been reached is never taken away. */
const frNeed=l=>Math.min(40,10*l-5);                                     // tasks needed to go from level l to the next: 5, 15, 25, ...
function frDay(k){
  const t=today(),lg=S.log[k]||{done:{}},tasks=tasksFor(k),dn=tasks.filter(x=>lg.done[x.id]).length,now=nowMin();
  const missed=k<t?tasks.length-dn:tasks.filter(x=>!lg.done[x.id]&&x.start!=null&&now>=x.start+x.len+GRACE).length;
  const onT=tasks.filter(x=>lg.done[x.id]&&lg.done[x.id].onTime).length;
  return dn+onT-missed;            // 1 for each finished task, 1 more if it was on time, 1 off for each missed
}
function frGrant(){if(S.own)WEAR.forEach(w=>{if(w.fr&&S.fr.lvl>=w.fr)S.own['w_'+w.id]=true;});}
function frSettle(k){
  if(!S.fr||!rewardable(k))return false;
  const v=frDay(k),was=(S.log[k]&&S.log[k].fr)||0,diff=v-was;if(!diff)return false;
  logW(k).fr=v;
  let p=S.fr.pts+diff,up=false;while(p>=frNeed(S.fr.lvl)){p-=frNeed(S.fr.lvl);S.fr.lvl++;up=true;}
  S.fr.pts=Math.max(0,p);
  if(up){frGrant();const got=WEAR.find(w=>w.fr===S.fr.lvl),lv=S.fr.lvl;setTimeout(()=>{toast('Friendship level '+lv+'!'+(got?' New outfit: '+got.name:''));sfx('win');},1500);}
  return true;
}
function frDefaults(){
  if(!S.fr||!(S.fr.lvl>=1)){                               // first time: start from every task ever finished, so nobody begins from zero
    let life=0;Object.keys(S.log).forEach(k=>{const lg=S.log[k];life+=(lg.legacy&&!lg.snap)?lg.legacy.done:Object.keys(lg.done||{}).length;});
    const lvl=Math.floor(Math.sqrt(life/5))+1;S.fr={lvl:lvl,pts:Math.min(frNeed(lvl)-1,Math.max(0,life-5*(lvl-1)*(lvl-1)))};
    const t=today();[t,addDays(t,-1)].forEach(k=>{if(S.log[k])S.log[k].fr=frDay(k);});
  }
  while(S.fr.pts>=frNeed(S.fr.lvl)){S.fr.pts-=frNeed(S.fr.lvl);S.fr.lvl++;}          // levels come quicker than they used to, so bank any points already earned
  frGrant();

/* Moving to these reward rules: keep whatever today and yesterday already paid, so nothing is taken away by the update. */
function adoptRewards(){
  if(S.eco===5)return;
  const t=today();[t,addDays(t,-1)].forEach(k=>{if(!S.log[k])return;const e=dayEarn(k),lg=S.log[k];lg.coins=e.coins;lg.bait=e.bait;lg.tix=e.tix;});
  S.eco=5;save();

/* When the date changes, freeze the finished days' task lists. */
function rollDays(){
  const t=today();if(S.lastDay===t)return false;
  let k=S.lastDay,guard=0;
  while(k<t&&guard++<400){const lg=logW(k);if(!lg.snap&&!lg.legacy)lg.snap=liveTasksFor(k).map(x=>({id:x.id,name:x.name,start:x.start,len:x.len}));
    if(!lg.snap.length&&!Object.keys(lg.done).length&&!lg.legacy)delete S.log[k];k=addDays(k,1);}
  S.tasks=S.tasks.filter(x=>!(x.repeat==='once'&&x.date<addDays(t,-1))&&!(x.ended&&x.ended<addDays(t,-1)));     // drop finished one-off tasks and long-deleted ones
  S.lastDay=t;save();return true;
}
function streaks(){
  const t=today();let cur=0,k=t,guard=0;
  while(k>=S.since&&guard++<3000){const i=dayInfo(k);
    if(i.total){if(i.pct>=0.5)cur++;else if(k!==t)break;}
    k=addDays(k,-1);}
  let best=0,run=0;k=S.since;guard=0;
  while(k<=t&&guard++<3000){const i=dayInfo(k);if(i.total){if(i.pct>=0.5){run++;best=Math.max(best,run);}else if(k!==t)run=0;}k=addDays(k,1);}
  let perfect=0;Object.keys(S.log).forEach(d=>{if(d<=t&&dayInfo(d).rate===5)perfect++;});
  S.bestStreak=Math.max(S.bestStreak,best,cur);
  return {cur:cur,best:S.bestStreak,perfect:perfect};
}

/* A pixel-art cloud sized to hold one task: a rounded body with a flat bottom and three puffs on top, the middle one tallest.

/* Cloud shapes. Each puff is [how far across, how far down from the top of the body, half-width as a share of the cloud, half-height]. */
const CLOUDS=[
  [[.22,2.4,.17,4.6],[.50,1.6,.23,7.6],[.79,2.6,.17,5.2]],                        // 1: tall in the middle
  [[.26,1.6,.22,7.4],[.57,2.4,.18,5.4],[.83,2.8,.14,3.8]],                        // 2: tall on the left, stepping down
  [[.17,2.8,.14,3.8],[.43,2.4,.18,5.4],[.74,1.6,.22,7.4]],                        // 3: tall on the right, stepping up
  [[.30,1.8,.23,6.8],[.71,2.0,.22,5.6]],                                          // 4: two big puffs
  [[.15,2.8,.12,3.6],[.36,2.0,.15,5.8],[.61,1.6,.16,6.8],[.85,2.6,.13,4.2]]];     // 5: four small puffs
function cloudSpr(bw,bh,fill,ol,kind){
  const T=7,P=new Spr(bw+3,bh+T+3),ox=1,oy=1+T,r=Math.min(5,Math.floor(bh/2));
  P.rect(ox+r,oy,bw-2*r,bh,fill);P.rect(ox,oy+r,bw,bh-2*r,fill);
  [[ox+r,oy+r],[ox+bw-r,oy+r],[ox+r,oy+bh-r],[ox+bw-r,oy+bh-r]].forEach(q=>P.ell(q[0],q[1],r,r,fill));
  (CLOUDS[kind||0]||CLOUDS[0]).forEach(q=>P.ell(ox+bw*q[0],oy+q[1],bw*q[2],q[3],fill));
  const sh=mix(fill,'#1b2340',0.13);for(let x=0;x<P.w;x++){for(let y=P.h-1;y>=0;y--){if(P.get(x,y)){P.set(x,y,sh);break;}}}                  // a soft shaded underside

}

    const id=(el.querySelector('[data-id]')||{dataset:{}}).dataset.id||'',pick=CLOUD_ON[[].reduce.call(id,(a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%CLOUD_ON.length];      // each task gets one shape at random and keeps it

function stepAcro(now){

  else if(t<2.5){const k=(t-0.5)/2,turns=5.5*(k<0.5?2*k*k:1-2*(1-k)*(1-k));rot=180;ty=onHead+Math.sin(k*40)*1.2;sx=Math.cos(turns*Math.PI*2);

/* Reads pasted text into tasks. One task per line: a name, a time or time range, and optionally days. */
const DAYWORD={sun:0,sunday:0,sundays:0,mon:1,monday:1,mondays:1,tue:2,tues:2,tuesday:2,tuesdays:2,wed:3,weds:3,wednesday:3,wednesdays:3,thu:4,thur:4,thurs:4,thursday:4,thursdays:4,fri:5,friday:5,fridays:5,sat:6,saturday:6,saturdays:6};
function clockOf(h,m,ap){h=+h;m=+(m||0);if(h>24||m>59)return null;ap=(ap||'').toLowerCase().replace(/[.\s]/g,'');
  if(ap==='pm'&&h<12)h+=12;else if(ap==='am'&&h===12)h=0;else if(!ap&&h>=1&&h<=6)h+=12;          // a bare 1 to 6 is taken as afternoon
  return h>=24?null:h*60+m;}
function parseSchedule(text){
  const AP='(a\\.?\\s?m\\.?|p\\.?\\s?m\\.?)',T='(\\d{1,2})(?:[:.](\\d{2}))?\\s*'+AP+'?';
  const RANGE=new RegExp('(?:^|[^\\d:])'+T+'\\s*(?:-|\u2013|\u2014|to|until|till)\\s*'+T+'(?![\\d:])','i'),ONE=new RegExp('(?:^|[^\\d:])(?:(\\d{1,2}):(\\d{2})\\s*'+AP+'?|(\\d{1,2})\\s*'+AP+')(?![\\d:])','i');
  const out=[];
  String(text||'').split(/\r?\n|;/).forEach(raw=>{
    if(out.length>=40)return;
    let line=' '+raw.replace(/^\s*(?:[-*\u2022\u00b7]+|\d+[.)])\s+/,'').trim()+' ',start=null,len=30,m;
    if((m=RANGE.exec(line))&&(m[2]||m[3]||m[5]||m[6])){
      let a=clockOf(m[1],m[2],m[3]||''),b=clockOf(m[4],m[5],m[6]||'');
      if(!m[3]&&m[6]){a=clockOf(m[1],m[2],m[6]);if(a!=null&&b!=null&&a>=b)a=clockOf(m[1],m[2],/p/i.test(m[6])?'am':'pm');}        // "9-5pm": the 9 borrows the pm, unless that puts it after the end
      else if(m[3]&&!m[6]){b=clockOf(m[4],m[5],m[3]);if(a!=null&&b!=null&&b<=a)b=clockOf(m[4],m[5],/p/i.test(m[3])?'am':'pm');}
      if(a!=null){start=a;if(b!=null&&b<=a&&b+720<=1440)b+=720;len=b!=null&&b>a?Math.max(5,Math.min(720,b-a)):30;line=line.replace(m[0],' ');}
    }
    if(start==null&&(m=ONE.exec(line))){const a=m[1]!=null?clockOf(m[1],m[2],m[3]||''):clockOf(m[4],0,m[5]);if(a!=null){start=a;line=line.replace(m[0],' ');}}
    let days=[];
    line=line.replace(/\b(every\s*day|everyday|daily|weekdays?|weekends?)\b/gi,w=>{w=w.toLowerCase();days=days.concat(/weekday/.test(w)?[1,2,3,4,5]:/weekend/.test(w)?[0,6]:ALLDAYS);return ' ';});
    line=line.replace(/\b([a-z]+)\b/gi,w=>{const d=DAYWORD[w.toLowerCase()];if(d==null)return w;days.push(d);return ' ';});
    days=ALLDAYS.filter(d=>days.includes(d));if(!days.length)days=ALLDAYS.slice();
    const name=line.replace(/\b(every|on|at|from|and)\b\s*(?=$|[,;:&\/\-]|\s*$)/gi,' ').replace(/[\s,;:&\/|@\-\u2013\u2014()]+/g,' ').replace(/^\s*(at|on|from|and|every)\s+/i,'').replace(/\s+(at|on|from|and|every)\s*$/i,'').trim();
    if(!name||!/[a-z]/i.test(name))return;
    out.push({name:name.charAt(0).toUpperCase()+name.slice(1,60),start:start,len:start==null?null:Math.min(len,1440-start),days:days});
  });
  return out;
}

function buddyStats(){

  for(let i=0;i<7;i++){const k=addDays(t,-i);if(k<S.since)break;const lg=S.log[k]||{done:{}};let dn,tot;
    if(lg.legacy&&!lg.snap){dn=lg.legacy.done;tot=lg.legacy.total;}
    else{const tasks=tasksFor(k),fin=tasks.filter(x=>lg.done[x.id]);dn=fin.length;
      tot=i===0?dn+tasks.filter(x=>!lg.done[x.id]&&x.start!=null&&now>=x.start+x.len).length:tasks.length;        // today only counts what is finished or already missed, so mornings are not held against you
      fin.forEach(x=>{const e=lg.done[x.id];if(e.q)return;known++;if(e.onTime)on++;});}
    d7+=dn;t7+=tot;if(i<3){d3+=dn;t3+=tot;}}

}

  try{const f=new File([text],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'ScheduleBuddy backup'});S.lastBackup=Date.now();save();toast('Backup saved');if(tab==='today')renderToday();return;}}catch(e){if(e&&e.name==='AbortError')return;}
