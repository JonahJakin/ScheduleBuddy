<script>
/* Pick light or dark before anything shows, so there is no flash. */
(function(){try{var t='auto',a=localStorage.getItem('schedulebuddy2'),b=localStorage.getItem('scheduleBuddyGameState');
  if(a)t=(JSON.parse(a).set||{}).theme||'auto';else if(b&&JSON.parse(b).darkMode)t='dark';
  if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ───────── COLORS ───────── */
:root{
  --navline:#fffaf0;
  --ink:#1b2340; --paper:#f6efdd; --card:#fffaf0; --well:#e9dfc8; --txt:#1b2340; --sub:#55607e;
  --teal:#2aa7a1; --coral:#f2706b; --butter:#ffd75e; --grass:#6fbf5f;
  --pix:'Jersey 15','Avenir Next Condensed','DIN Condensed','Arial Narrow',sans-serif; --body:'Nunito','Trebuchet MS','Segoe UI',sans-serif;
  /* Breathing room at the screen edges. st0 is the phone's own safe area at the top; st and sb add extra space on top of the phone's own. */
  --st0:env(safe-area-inset-top,0px);
  --st:calc(env(safe-area-inset-top,0px) + 12px);
  --sb:calc(max(env(safe-area-inset-bottom,0px), 10px) + 6px);
}
:root[data-theme="dark"]{ --navline:#0b1022; --paper:#141a30; --card:#1f2745; --well:#2a3358; --txt:#f3ecd8; --sub:#aab3d0; --ink:#0b1022; }

/* ───────── BASE ───────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
[hidden]{display:none!important;}
html,body{height:100%;}
html{background:var(--paper);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{overflow:hidden;background:var(--paper);color:var(--txt);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select{font:inherit;font-size:16px;color:inherit;}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;position:relative;}
.tabs{flex:1;position:relative;overflow:hidden;}
.tab{position:absolute;inset:0;display:none;flex-direction:column;}
.tab.on{display:flex;}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + var(--st)) 16px 24px;}
h1{font-family:var(--pix);font-weight:400;font-size:36px;line-height:1;}
h2{font-family:var(--pix);font-weight:400;font-size:26px;line-height:1.05;}
.lbl{display:block;font-weight:800;font-size:14px;color:var(--sub);margin:18px 2px 8px;}
.note{font-size:14px;color:var(--sub);}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:14px;}

/* ───────── BUTTONS ───────── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:var(--pix);font-size:25px;line-height:1.1;color:#1b2340;background:var(--butter);border:3px solid var(--ink);border-radius:10px;padding:10px 16px;box-shadow:0 5px 0 var(--ink);transition:transform .05s,box-shadow .05s;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.btn.b{background:var(--teal);color:#fffaf0;} .btn.p{background:#6a5a9c;color:#fffaf0;} .btn.c{background:var(--card);color:var(--txt);} .btn.d{background:var(--coral);}
.btn.sm{width:auto;font-size:21px;padding:6px 12px;box-shadow:0 4px 0 var(--ink);border-radius:9px;}
.btn.sm:active{transform:translateY(3px);}
.icb{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;box-shadow:0 3px 0 var(--ink);font-family:var(--pix);font-size:26px;line-height:1;}
.icb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
.icb[disabled]{opacity:.35;pointer-events:none;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{flex:1;min-width:0;font-family:var(--pix);font-size:21px;line-height:1.1;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;padding:7px 6px;box-shadow:0 4px 0 var(--ink);white-space:nowrap;}
.seg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.seg button.on{background:var(--butter);color:#1b2340;}
.field{width:100%;height:50px;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:10px;padding:0 12px;outline:none;font-weight:700;-webkit-appearance:none;appearance:none;}
.field:focus{border-color:var(--coral);}

/* ───────── NAV ───────── */
.nav{display:flex;background:var(--card);position:relative;z-index:5;}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 calc(6px + var(--sb));font-family:var(--pix);font-size:17px;line-height:1;color:var(--txt);}       /* the safe space is inside each button, so the selected color runs to the very bottom */
.nav button.on{background:var(--butter);color:#1b2340;}
.nav canvas{width:28px;height:28px;}

/* ───────── TODAY: sky, header, timeline ───────── */
#t-today{background:#7fc0f0;}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.sky canvas{position:absolute;width:42px;height:42px;}
.star{position:absolute;width:3px;height:3px;background:#fffdf5;}
.top{position:relative;z-index:3;padding:calc(10px + var(--st)) 12px 8px;display:flex;flex-direction:column;gap:8px;}
.toprow{display:flex;align-items:center;gap:8px;}
.toprow .btn{margin-left:auto;flex-shrink:0;}
.chips{display:flex;gap:7px;min-width:0;}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;box-shadow:3px 3px 0 var(--ink);padding:2px 8px 2px 5px;font-family:var(--pix);font-size:23px;line-height:1.15;white-space:nowrap;}
.chip.bump{animation:bump .35s ease;}
@keyframes bump{40%{transform:translateY(-5px) scale(1.08)}}
.daybar{display:flex;align-items:center;gap:8px;}
.daybar .title{flex:1;min-width:0;text-align:center;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;box-shadow:0 3px 0 var(--ink);height:40px;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:23px;line-height:1;white-space:nowrap;overflow:hidden;}
.scroll{position:relative;z-index:2;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.any{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:20px 12px 6px 12px;}
.any-l{font-family:var(--pix);font-size:21px;line-height:1;color:#1b2340;}
.any .blk{position:relative;min-height:48px;width:min(250px,66%);}
.night .any-l{color:#f3ecd8;}
.tl2{position:relative;margin-top:6px;}
.tl-rail{position:absolute;left:16px;top:0;bottom:0;width:4px;background:rgba(27,35,64,.3);}
.tl-hour{position:absolute;left:28px;font-family:var(--pix);font-size:19px;line-height:1;color:#1b2340;}
.night .tl-hour{color:#f3ecd8;} .night .tl-rail{background:rgba(243,236,216,.35);}
.blk{position:absolute;z-index:2;background:#fffaf0;color:#1b2340;border:3px solid #1b2340;border-radius:8px;box-shadow:3px 3px 0 #1b2340;display:flex;align-items:stretch;overflow:hidden;}
.blk-main{flex:1;min-width:0;padding:5px 4px 5px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center;}
.blk b{font-weight:800;font-size:15px;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.blk small{font-size:12.5px;color:#55607e;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.blk.done{background:#d8f0c8;} .blk.now{background:#ffd75e;} .blk.late{background:#f6ddd6;} .blk.late small{color:#b3403d;}
.night .blk{border-color:#0b1022;box-shadow:3px 3px 0 #0b1022;}
.chk{width:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.chk i{width:30px;height:30px;border:3px solid #1b2340;border-radius:50%;background:#fffaf0;display:flex;align-items:center;justify-content:center;transition:transform .08s;}
.chk:active i{transform:scale(.88);}
.blk.done .chk i{background:#6fbf5f;}
.blk.done .chk i::after{content:'';width:12px;height:6px;border-left:3px solid #1b2340;border-bottom:3px solid #1b2340;transform:rotate(-45deg) translate(1px,-1px);}
.nowline{position:absolute;left:0;right:0;z-index:1;height:3px;background:#f2706b;box-shadow:0 2px 0 #1b2340;}
.nowtag{position:absolute;z-index:3;left:8px;font-family:var(--pix);font-size:21px;line-height:1.15;background:#f2706b;color:#1b2340;border:3px solid #1b2340;border-radius:6px;padding:0 7px;}
.tl2 canvas{position:absolute;z-index:4;pointer-events:none;}
.tl2 canvas.hop{animation:hop .55s cubic-bezier(.3,.6,.4,1) 2;}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px)}}
.spark{position:absolute;z-index:5;width:6px;height:6px;background:#ffd75e;box-shadow:0 0 0 2px #1b2340;animation:spark .8s ease-out forwards;pointer-events:none;}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#homeC{margin-top:6px;max-width:none;}
.daybanner{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--txt);border:3px solid var(--ink);border-radius:9px;box-shadow:3px 3px 0 var(--ink);padding:5px 6px 7px 12px;font-family:var(--pix);font-size:23px;line-height:1;}
.daybanner span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.daybanner .btn.sm{font-size:19px;padding:4px 9px;}
.trayhint{position:absolute;right:12px;bottom:12px;z-index:6;display:flex;align-items:center;gap:7px;font-family:var(--pix);font-size:21px;line-height:1.1;color:#1b2340;background:#ffd75e;border:3px solid #1b2340;border-radius:9px;box-shadow:0 4px 0 #1b2340;padding:4px 10px;}
.trayhint i{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #1b2340;}
.emptywrap{position:sticky;top:calc(50% - 96px);z-index:6;height:0;display:flex;justify-content:center;}
.empty{width:220px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:40px;}
.empty h2{color:#fffdf5;font-size:32px;text-shadow:2px 2px 0 #1b2340;}
.empty .btn{font-size:22px;padding:8px 14px;width:auto;}

/* ───────── CALENDAR ───────── */
.calhead{display:flex;align-items:center;gap:8px;margin:14px 0 12px;}
.calhead .title{flex:1;text-align:center;font-family:var(--pix);font-size:27px;line-height:1;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal span{text-align:center;font-family:var(--pix);font-size:18px;color:var(--sub);line-height:1;}
.day{aspect-ratio:1;border:3px solid var(--ink);border-radius:8px;background:var(--card);color:var(--txt);font-family:var(--pix);font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.day.r5{background:#3d8a4e;color:#fffdf5;} .day.r4{background:#6fbf5f;color:#1b2340;} .day.r3{background:#ffd75e;color:#1b2340;} .day.r2{background:#f2a65a;color:#1b2340;} .day.r1{background:#f2706b;color:#1b2340;}
.day.off{border-color:transparent;background:none;color:var(--sub);opacity:.55;}
.day.plan{border-style:dashed;background:none;color:var(--txt);}
.day.today{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--coral);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.stat{text-align:center;padding:10px 4px;}
.stat b{display:block;font-family:var(--pix);font-weight:400;font-size:34px;line-height:1;}
.stat small{font-size:12.5px;font-weight:800;color:var(--sub);}
.legend{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:13px;font-weight:700;color:var(--sub);}
.legend i{width:16px;height:16px;border:2px solid var(--ink);border-radius:4px;}

/* ───────── SETTINGS / ADVENTURE ───────── */
.buds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.budpick{background:var(--card);border:3px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--ink);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;font-family:var(--pix);font-size:18px;line-height:1;color:var(--txt);}
.budpick.on{background:var(--butter);color:#1b2340;}
.budpick canvas{max-width:100%;}
.row{display:flex;align-items:center;gap:10px;}
.row > *{flex:1;min-width:0;}
.srow{display:flex;flex-direction:column;gap:10px;}
.adv{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}

/* ───────── ADVENTURE: map, fish book, fishing game ───────── */
.mapwrap{position:relative;padding:0;overflow:hidden;margin:0 auto;box-sizing:content-box;}
.pin{position:relative;}
#mapC{display:block;}
#mapBud{position:absolute;pointer-events:none;z-index:3;}
.spot{position:absolute;width:52px;height:52px;margin:-30px 0 0 -26px;border-radius:50%;z-index:4;}
.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bcell{background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:6px 4px 7px;text-align:center;min-width:0;}
.bcell b{display:block;font-family:var(--pix);font-weight:400;font-size:18px;line-height:1.05;margin-top:4px;}
.bcell small{display:block;font-size:11.5px;font-weight:700;color:var(--sub);line-height:1.3;margin-top:2px;}
.bcell.no{background:var(--well);}
.bcell.r2:not(.no){background:#d7ecf7;color:#1b2340;} .bcell.r3:not(.no){background:#ffe9a0;color:#1b2340;}
.bcell.r2:not(.no) small,.bcell.r3:not(.no) small{color:#55607e;}
.bimg{height:56px;display:flex;align-items:center;justify-content:center;}
.bimg.sm{height:auto;width:62px;flex-shrink:0;}
#game{position:fixed;inset:0;z-index:40;background:#1c6f78;touch-action:none;overflow:hidden;}
#gameC{width:100%;height:100%;}
#gHud{position:absolute;left:12px;top:calc(12px + var(--st));font-family:var(--pix);font-size:26px;line-height:1.1;color:#1b2340;background:#fffaf0;border:3px solid #1b2340;border-radius:9px;box-shadow:3px 3px 0 #1b2340;padding:2px 10px;white-space:pre;}
#gQuit{position:absolute;right:12px;top:calc(12px + var(--st));}
#gMsg{position:absolute;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);text-align:center;font-family:var(--pix);font-size:24px;line-height:1.1;color:#1b2340;background:#ffd75e;border:3px solid #1b2340;border-radius:9px;padding:3px 12px;opacity:0;transition:opacity .2s;pointer-events:none;}
#gMsg.on{opacity:1;}

/* ───────── HOME AND SHOP ───────── */
.view{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
.vhead{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--st)) 12px 10px;}
.vhead h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vhead.shop{padding-top:8px;}
#awn{flex-shrink:0;margin-top:var(--st0);max-width:none;}
.shopbody{flex:1;overflow-y:auto;padding:0 12px calc(20px + var(--sb));}
.roomwrap{position:relative;box-sizing:content-box;margin:0 auto;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;}
#roomC{display:block;}
.roombud{position:absolute;pointer-events:none;z-index:2;animation:roam 14s steps(28) infinite alternate;}
@keyframes roam{from{transform:translateX(-170%)}to{transform:translateX(150%)}}
.rslot{position:absolute;z-index:3;border-radius:8px;}
/* empty spots flash a ghost outline for a few seconds when you walk in */
.rslot.ghost::after{content:'+';position:absolute;inset:3px;border:2px dashed #fffaf0;border-radius:7px;background:rgba(255,250,240,.28);box-shadow:0 0 0 2px rgba(27,35,64,.55);display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:22px;line-height:1;color:#1b2340;opacity:0;animation:ghost .9s ease-in-out 4;pointer-events:none;}
@keyframes ghost{50%{opacity:1}}
.rslot:active{background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 2px #1b2340;}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.icard{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0;}
.icard.on{background:var(--butter);color:#1b2340;}

<script>
'use strict';
/* ═════════ PIXEL ART ═════════ (palette, the painter, buddies, icons, the little house) */
/* ───────── palette ───────── */
const C={ink:'#1b2340',white:'#fffdf5',fog:'#d9dbe3',cream:'#f4e9d0',sand:'#e3c58f',dsand:'#c9a56c',
  grey:'#aab3c4',dgrey:'#7c869c',coal:'#2e3350',brown:'#9a6a45',dbrown:'#77492f',wood:'#b98455',
  orange:'#f2a65a',dorange:'#d9823b',butter:'#ffd75e',dbutter:'#e6b23a',coral:'#f2706b',dcoral:'#cf514f',pink:'#f7a8b0',
  teal:'#2aa7a1',deep:'#1c6f78',aqua:'#7fd6cf',sky:'#8fc8f0',blue:'#4b7fd1',dblue:'#3b4a7a',navy:'#2a3560',
  grass:'#6fbf5f',dgrass:'#3d8a4e',dusk:'#6a5a9c',peach:'#ffc9a3'};
const SHADE={[C.white]:C.fog,[C.cream]:C.sand,[C.sand]:C.dsand,[C.grey]:C.dgrey,[C.coal]:'#20243b',[C.brown]:C.dbrown,[C.wood]:C.brown,
  [C.orange]:C.dorange,[C.butter]:C.dbutter,[C.coral]:C.dcoral,[C.teal]:C.deep,[C.aqua]:C.teal,[C.sky]:C.blue,[C.blue]:C.dblue,
  [C.dblue]:C.navy,[C.grass]:C.dgrass,[C.dgrass]:'#2c6a3c',[C.pink]:C.coral,[C.fog]:C.grey,[C.dusk]:'#4c4078',[C.dorange]:'#b8652a'};

const SEAM={[C.white]:C.grey,[C.cream]:C.dsand,[C.fog]:C.dgrey};
function seamOf(c){return SEAM[c]||SHADE[SHADE[c]]||SHADE[c]||C.ink;}
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}

/* ───────── tiny pixel painter ───────── */
class Spr{
  constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null);}
  set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=c;return this;}
  get(x,y){return (x<0||y<0||x>=this.w||y>=this.h)?null:this.d[y*this.w+x];}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c);return this;}
  ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c);}return this;}
  line(x0,y0,x1,y1,c){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++)this.set(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c);return this;}
  rows(x,y,list,c){list.forEach((r,j)=>this.rect(x+r[0],y+j,r[1],1,c));return this;}      // list of [offset,width] per row
  shade(){const out=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const c=this.get(x,y);if(!c||!SHADE[c])continue;
    if(!this.get(x,y+1)||(!this.get(x+1,y)&&!this.get(x+1,y+1)))out[y*this.w+x]=SHADE[c];}this.d=out;return this;}
  outline(c){const o=new Spr(this.w,this.h);o.d=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(this.get(x,y))continue;
    if(this.get(x-1,y)||this.get(x+1,y)||this.get(x,y-1)||this.get(x,y+1))o.d[y*this.w+x]=c||C.ink;}return o;}
  blit(s,dx,dy){dx=dx||0;dy=dy||0;for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const c=s.get(x,y);if(c)this.set(x+dx,y+dy,c);}return this;}
  part(fn,noShade){const p=new Spr(this.w,this.h);fn(p);if(!noShade)p.shade();return this.blit(p.outline());}   // draw a piece, shade it, outline it, lay it on top
  lay(fn,noShade){                                  // like part(), but with no hard outline: where the new piece overlaps what is already there, it leaves a soft darker seam
    const p=new Spr(this.w,this.h);fn(p);if(!noShade)p.shade();
    for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(p.get(x,y)||!this.get(x,y))continue;
      if(p.get(x-1,y)||p.get(x+1,y)||p.get(x,y-1)||p.get(x,y+1))this.set(x,y,seamOf(this.get(x,y)));}
    return this.blit(p);}
  night(amt,keep){const o=new Spr(this.w,this.h);o.d=this.d.map(c=>(!c||keep.indexOf(c)>-1)?c:mix(c,'#141a3a',amt));return o;}
  recolor(map){const o=new Spr(this.w,this.h);o.d=this.d.map(c=>c&&map[c]?map[c]:c);return o;}       // swap exact colors, for furniture variants
  tint(c){const o=new Spr(this.w,this.h);o.d=this.d.map(v=>v?c:null);return o;}
  paint(cv){cv.width=this.w;cv.height=this.h;const g=cv.getContext('2d');g.clearRect(0,0,this.w,this.h);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const c=this.get(x,y);if(c){g.fillStyle=c;g.fillRect(x,y,1,1);}}return cv;}
}
function show(spr,scale,parent,label){
  const wrap=document.createElement('div'),cv=document.createElement('canvas');
  spr.paint(cv);cv.style.width=spr.w*scale+'px';cv.style.height=spr.h*scale+'px';wrap.appendChild(cv);
  if(label){const l=document.createElement('div');l.className='cap';l.textContent=label;wrap.appendChild(l);}
  parent.appendChild(wrap);return cv;
}

/* ───────── the buddies ───────── */
const CAT_EAR_L=[[2,2],[1,4],[1,5],[0,6],[0,6],[0,6],[1,5],[1,5]],CAT_EAR_R=[[2,2],[1,4],[0,5],[0,6],[0,6],[0,6],[0,5],[0,5]];     // narrow, round-tipped, and tucking in at the base
const CAT_IN_L=[[2,2],[2,3],[2,3]],CAT_IN_R=[[2,2],[1,3],[1,3]];

const WIN='#ffe9a0';
const SMOKE='#eef0f6';
function home(nightAmt,up,phase){
  up=up||{};phase=phase||0;
  const W=150,H=90,G=16,S=new Spr(W,H),lit=nightAmt>0.25,roofC=C[up.roof]||C.coral;
  for(let x=0;x<W;x++){const top=44+G+Math.round(Math.sin(x/9)*1.5+Math.sin(x/3.7));S.rect(x,top,1,H-top,C.grass);S.set(x,top,C.dgrass);}
  for(let i=0;i<46;i++){const x=(i*29+7)%W,y=50+G+(i*17)%22;S.set(x,y,C.dgrass).set(x+1,y-1,C.dgrass);}
  [[73,57,8],[72,60,10],[70,63,13],[68,66,16],[65,69,20],[62,72,24]].forEach(q=>S.rect(q[0],q[1]+G,q[2],3,C.sand));
  S.part(p=>{p.rect(22,34+G,3,14,C.brown);},true);S.part(p=>{p.ell(23.5,25+G,9,9.5,C.dgrass);});[[18,19],[19,18],[20,18],[17,21]].forEach(q=>S.set(q[0],q[1]+G,C.grass));
  S.part(p=>{p.ell(120,46+G,7,4.6,C.dgrass);p.ell(129,47+G,5,3.6,C.dgrass);});
  // the house: wall runs x 58 to 95. Windows sit beside the door, the same 4 pixels in from each side wall and 3 from the door.
  const wallTop=up.upstairs?39:55,roofTop=wallTop-12;
  if(up.chimney){S.part(p=>{p.rect(86,roofTop-2,6,12,C.dbrown);p.rect(85,roofTop-3,8,2,C.wood);},true);
    if(lit)for(let i=0;i<4;i++){const r=((phase+i*5)%20)/20;                    // four puffs drifting up and to the side, growing as they rise
      const px=89+r*9+Math.sin((r*6)+i)*1.5,py=roofTop-6-r*24,rad=1.2+r*2.6;if(py>1)S.ell(px,py,rad,rad*0.85,SMOKE);}}
  S.part(p=>{p.rows(54,roofTop,[[20,6],[18,10],[16,14],[14,18],[12,22],[10,26],[8,30],[6,34],[4,38],[2,42],[0,46],[0,46]],roofC);},false);
  S.part(p=>{p.rect(58,wallTop,38,72-wallTop,C.cream);},false);
  S.rect(58,wallTop,38,2,C.sand);
  S.part(p=>{p.rect(73,60,8,12,C.brown);},true);S.set(79,66,C.butter);
  const pane=lit?WIN:C.sky;
  const win=(x,y)=>{S.part(p=>{p.rect(x,y,8,9,C.wood);},true);S.rect(x+1,y+1,6,7,pane);S.rect(x+4,y+1,1,7,C.wood);S.rect(x+1,y+4,6,1,C.wood);};

  for(let y=0;y<204;y++){const cx=riverX(y),half=y<186?5:5+Math.round((y-186)*0.5);S.rect(cx-half,y,half*2+1,1,C.aqua);if(y<186){S.set(cx-half-1,y,C.teal);S.set(cx+half+1,y,C.teal);}}
  for(let y=6;y<184;y+=7){const cx=riverX(y);S.rect(cx-2+((y/7)%2)*3,y,3,1,C.white);}

  [['home','pond'],['home','river'],['home','ice'],['home','pier'],['pier','reef'],['pier','trench']].forEach(pp=>{const a=MAPN[pp[0]],b=MAPN[pp[1]],n=Math.round(Math.hypot(b.x-a.x,b.y-a.y)/6);
    for(let i=1;i<n;i++){const x=Math.round(a.x+(b.x-a.x)*i/n),y=Math.round(a.y+(b.y-a.y)*i/n),u=S.get(x,y),wet=u===C.aqua||u===C.blue||u===C.dblue||u==='#9fe6dc'||u===C.teal;

  [[14,74],[70,70],[96,100],[12,138],[72,112],[108,156],[166,150],[20,176],[62,170],[160,96],[166,118]].forEach(q=>S.blit(mTree(false),q[0],q[1]));

/* ───────── the fishing game ─────────
   Drop: steer the hook down past the fish. Touch one and the drop ends. Reel: on the way up, steer INTO fish to hook them. */
const PPM=28;            // pixels per metre of depth
let G=null;
function startCast(id){
  const sp=SPOT[id];if(!sp||!S.spots[id])return;
  if(S.wallet.bait<1){toast('No bait');return;}
  const glow=!!(sheetCtx&&sheetCtx.glow)&&S.gear.glow>0;
  S.wallet.bait--;if(glow)S.gear.glow--;flush();sfx('cast');
  closeSheet();
  const el=$('game');el.hidden=false;const cv=$('gameC'),W=el.clientWidth,H=el.clientHeight;cv.width=W;cv.height=H;
  const reach=Math.min(LINE[S.gear.line-1],sp.depth);
  G={sp:sp,W:W,H:H,reach:reach*PPM,phase:'ready',t:0,x:W/2,tx:W/2,y:0,fish:[],caught:[],cap:HOOK[S.gear.hook-1],lure:10+S.gear.lure*3.5,steer:4.5+S.gear.reel*1.5,drop:150+S.gear.reel*14,asc:112,bumps:1,glow:glow,last:performance.now(),bub:[]};
  // stock the water: one thing roughly every 1.7 m, chosen from what lives at that depth
  let gotLegend=false;
  for(let d=1.6;d<reach-0.3;d+=1.25+Math.random()*0.9){
    if(d<reach*0.25&&Math.random()<0.5)continue;                 // thinner near the surface, so the drop gets going
    let pick=null;const roll=Math.random();
    if(roll<0.006*(glow?3:1)){pick=FISH.j_chest;}
    else if(roll<0.07){pick=JUNK[Math.floor(Math.random()*3)];}
    else{const pool=sp.fish.filter(f=>d>=f.d0&&d<=f.d1&&!(f.rar===3&&gotLegend));let tot=0;const w=pool.map(f=>{const x=RAR_W[f.rar]*(glow&&f.rar>=2?3:1);tot+=x;return x;});
      let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){pick=pool[i];break;}}
      if(pick&&pick.rar===3)gotLegend=true;}
    if(!pick)continue;
    const cvs=fishCanvas(pick.id),sc=pick.sc,dir=Math.random()<0.5?-1:1;
    G.fish.push({f:pick,x:20+Math.random()*(W-40),y:d*PPM,dir:dir,v:pick.v*(0.75+Math.random()*0.5),w:cvs.width*sc,h:cvs.height*sc,r:Math.max(cvs.width,cvs.height)*sc*0.36,ph:Math.random()*6,cv:cvs,sc:sc});
  }
  $('gHud').textContent='';gameMsg('Dodge the fish on the way down');
  requestAnimationFrame(gameStep);
}
let gMsgT=null;
function gameMsg(t){const el=$('gMsg');el.textContent=t;el.classList.add('on');clearTimeout(gMsgT);gMsgT=setTimeout(()=>el.classList.remove('on'),1900);}
function gameStep(now){
  if(!G||G.phase==='done')return;
  const dt=Math.min(0.05,(now-G.last)/1000);G.last=now;G.t+=dt;
  if(G.phase==='ready'&&G.t>0.9)G.phase='drop';
  G.x+=(G.tx-G.x)*Math.min(1,G.steer*dt);G.x=Math.max(10,Math.min(G.W-10,G.x));
  const deep=G.y/(130*PPM);                                  // the deeper the hook, the faster the line runs, so long casts do not drag
  if(G.phase==='drop'){G.y+=G.drop*(1+deep*1.2)*dt;if(G.y>=G.reach){G.y=G.reach;G.phase='reel';gameMsg(G.reach<G.sp.depth*PPM?'Line ran out. Reel in and catch them!':'The bottom! Reel in and catch them!');}}
  else if(G.phase==='reel'){G.y-=G.asc*(1+deep*0.9)*(G.caught.length>=G.cap?2.6:1)*dt;if(G.y<=0){G.y=0;return gameEnd();}}
  G.fish.forEach(o=>{
    if(o.hooked)return;
    o.x+=o.dir*o.v*dt;if(o.x<-10){o.x=-10;o.dir=1;}if(o.x>G.W+10){o.x=G.W+10;o.dir=-1;}
    const dx=o.x-G.x,dy=o.y+Math.sin(G.t*2+o.ph)*3-G.y,dist=Math.hypot(dx,dy);
    if(G.phase==='drop'&&o.safe)return;
    if(G.phase==='drop'&&dist<o.r){
      if(G.bumps>0){G.bumps--;o.safe=true;o.dir=o.x<G.x?-1:1;o.v*=2.5;gameMsg('Bumped! One more touch ends the drop');sfx('bump');}          // the first touch on the way down is forgiven
      else{o.hooked=true;G.caught.push(o);G.phase='reel';gameMsg('Hooked one. Reel in and catch more!');sfx('hook');}
    }
    else if(G.phase==='reel'&&G.caught.length<G.cap&&dist<o.r+G.lure){o.hooked=true;G.caught.push(o);sfx('hook');}
  });
  drawGame();
  $('gHud').textContent=Math.round(G.y/PPM)+' m    '+G.caught.length+' / '+G.cap;
  requestAnimationFrame(gameStep);
}
function drawGame(){
  const cv=$('gameC'),g=cv.getContext('2d'),W=G.W,H=G.H,cam=G.y-H*0.38,sp=G.sp;g.imageSmoothingEnabled=false;
  const depthPx=sp.depth*PPM;
  for(let sy=0;sy<H;sy+=16){const wy=sy+cam;
    if(wy<0)g.fillStyle=skyAt(nowMin()/60);
    else if(wy>=depthPx)g.fillStyle=C.dsand;
    else g.fillStyle=mix(mix(sp.water[0],sp.water[1],Math.min(1,wy/depthPx)),'#070b1e',Math.min(0.55,wy/(130*PPM)*0.6));
    g.fillRect(0,sy,W,16);}
  const s0=-cam;                                             // where the surface is on screen
  if(s0>-20&&s0<H){g.fillStyle=C.white;for(let x=0;x<W;x+=12)g.fillRect(x+((G.t*14)%12),s0+(Math.floor(x/12)%2)*2,7,2);}
  if(depthPx-cam<H){g.fillStyle=C.sand;g.fillRect(0,depthPx-cam,W,4);}
  g.font='18px "Jersey 15",sans-serif';g.textBaseline='middle';
  for(let m=10;m<=sp.depth;m+=10){const sy=m*PPM-cam;if(sy<-10||sy>H+10)continue;g.fillStyle='rgba(255,255,255,.22)';for(let x=0;x<W;x+=14)g.fillRect(x,sy,7,2);g.fillStyle='rgba(255,255,255,.7)';g.fillText(m+' m',W-44,sy-10);}
  // the buddy on a little raft at the surface
  if(s0>-140){const b=buddyCanvas(),bw=B2W*2,bh=B2H*2,bx=W/2-bw/2-18,by=s0-bh*0.86;g.fillStyle=C.wood;g.fillRect(bx+6,s0-8,bw+4,8);g.fillStyle=C.brown;g.fillRect(bx+6,s0-2,bw+4,3);g.drawImage(b,bx,by,bw,bh);}
  // line
  g.strokeStyle=C.ink;g.lineWidth=2;g.beginPath();g.moveTo(W/2+26,Math.max(-10,s0-60));g.lineTo(G.x,G.y-cam);g.stroke();
  // fish
  G.fish.forEach((o,i)=>{
    let x,y;
    if(o.hooked){const n=G.caught.indexOf(o);x=G.x+Math.sin(G.t*6+n)*4;y=G.y-cam+14+n*10;}
    else{x=o.x;y=o.y-cam+Math.sin(G.t*2+o.ph)*3;if(y<-60||y>H+60)return;}
    g.save();g.translate(Math.round(x),Math.round(y));if(o.hooked)g.rotate(Math.PI/2);else if(o.dir>0)g.scale(-1,1);
    if(o.y>50*PPM){g.shadowColor='rgba(170,225,255,.8)';g.shadowBlur=8;}                       // a pale glow in dark water, so dark fish can be seen
    g.drawImage(o.cv,-o.w/2,-o.h/2,o.w,o.h);g.restore();
  });
  // hook, with a ring showing how far it can grab on the way up
  const hx=Math.round(G.x),hy=Math.round(G.y-cam);
  if(G.phase==='reel'&&G.caught.length<G.cap){g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=2;g.setLineDash([4,5]);g.beginPath();g.arc(hx,hy,G.lure+8,0,Math.PI*2);g.stroke();g.setLineDash([]);}
  g.fillStyle=C.ink;g.fillRect(hx-6,hy-9,6,20);g.fillRect(hx-6,hy+5,14,6);g.fillRect(hx+2,hy-1,6,12);                 // the hook: dark outline, pale metal
  g.fillStyle=C.white;g.fillRect(hx-4,hy-7,2,14);g.fillRect(hx-4,hy+7,10,2);g.fillRect(hx+4,hy+1,2,8);
  if(G.glow){g.fillStyle=X.gold;g.fillRect(hx-2,hy+11,6,5);}
}
let _bc=null,_bk='';
function buddyCanvas(){const key=S.buddy+'|'+JSON.stringify(S.wear||{});if(_bk!==key){_bk=key;_bc=document.createElement('canvas');buddy(S.buddy,{hat:(S.wear&&S.wear.hat)||'straw',neck:S.wear&&S.wear.neck||undefined,rod:true}).paint(_bc);}return _bc;}
function gameEnd(){
  G.phase='done';
  const got={},t=today(),lg=logW(t);let total=0,order=[];
  G.caught.forEach(o=>{const f=o.f;let v=f.value;if(f.chest)v=Math.round(G.sp.tier*(8+Math.floor(Math.random()*7)));total+=v;
    if(!got[f.id]){got[f.id]={f:f,n:0,v:0,isNew:!f.junk&&!S.book[f.id]};order.push(f.id);}got[f.id].n++;got[f.id].v+=v;});
  order.forEach(id=>{const e=got[id];if(!e.f.junk){S.book[id]=(S.book[id]||0)+e.n;lg.fish=lg.fish||[];for(let i=0;i<e.n;i++)lg.fish.push(id);}});
  S.wallet.coins+=total;flush();sfx(total>0?'win':'over');
  let h='<h2>'+(order.length?'Nice catch':'Nothing this time')+'</h2>';
  if(order.length)h+='<div class="panel" style="padding:4px 12px">'+order.map(id=>{const e=got[id];return '<div class="drow"><div class="bimg sm">'+fishImg(id,2)+'</div><div class="drow-b"><b>'+esc(e.f.name)+(e.n>1?' \u00d7'+e.n:'')+'</b><small>'+(e.f.junk?(e.f.chest?'Treasure':'Junk'):RAR[e.f.rar])+'</small></div>'+(e.isNew?'<span class="tag t2">New</span>':'')+'<span class="tag t4">+'+e.v+'</span></div>';}).join('')+'</div>'
    +'<p style="font-family:var(--pix);font-size:26px;color:var(--txt);text-align:center">+'+total+(total===1?' coin':' coins')+'</p>';
  else h+='<p>The fish got away. Steer into them on the way back up.</p>';
  h+=(S.wallet.bait>0?'<button class="btn" data-a="cast" data-v="'+G.sp.id+'">Cast again, '+S.wallet.bait+' bait left</button>':'<p>Out of bait. Finish tasks on time to earn more.</p>')+'<button class="btn c" data-a="close">Done</button>';
  sheetCtx={spot:G.sp.id,glow:false};const keep=sheetCtx;openSheet(h);sheetCtx=keep;
}
function gameClosed(){if(G&&G.phase==='done'&&$('sheet').hidden){G=null;$('game').hidden=true;if(tab==='adv')renderAdv();}}

function roomSpr(i){
  const R=S.rooms[i]||S.rooms[0],S2=new Spr(RW,RH),pc=PAPER[R.paper]||PAPER.paper_cream,fc=FLOORC[R.floor]||FLOORC.floor_wood;
  S2.rect(0,0,RW,FL,pc[0]);
  if(R.paper==='paper_wood'){for(let x=0;x<RW;x+=14)S2.rect(x,0,1,FL,pc[1]);}else for(let x=6;x<RW;x+=12)S2.rect(x,0,2,FL,pc[1]);
  S2.rect(0,FL-5,RW,5,C.wood);S2.rect(0,FL-1,RW,1,C.dbrown);
  if(R.floor==='floor_check'){for(let y=FL;y<RH;y+=7)for(let x=0;x<RW;x+=14)S2.rect(x,y,14,7,((x/14+(y-FL)/7)%2)?fc[1]:fc[0]);}
  else{S2.rect(0,FL,RW,RH-FL,fc[0]);for(let y=FL+8;y<RH;y+=9)S2.rect(0,y,RW,1,fc[1]);for(let k=0;k<16;k++)S2.rect((k*47+13)%RW,FL+((k%4)*9)+1,1,8,fc[1]);}
  const win=windowS().recolor({[C.sky]:skyAt(nowMin()/60)});S2.blit(win,12,22);S2.blit(win,164,22);          // the windows show the real time of day
  SLOTS.forEach(sl=>{
    const id=R[sl.id],it=id&&ITEM[id];if(!it||sl.id==='paper'||sl.id==='floor')return;
    const sp=sl.id==='lights'?lights(RW):it.spr();
    if(sl.wall)S2.blit(sp,sl.wall[0],sl.wall[1]);else S2.blit(sp,sl.floor[0],sl.floor[1]-sp.h);
    if(id==='tank'){const best=Object.keys(S.book).filter(k=>FISH[k]&&FISH[k].look.c1).sort((a,b)=>FISH[b].value-FISH[a].value).slice(0,3);          // the aquarium shows your three best catches
      [[178,86],[188,90],[183,83]].forEach((q,n)=>{const f=best[n];if(!f)return;S2.rect(q[0],q[1],4,2,FISH[f].look.c1);S2.set(q[0]+4,q[1],FISH[f].look.c1).set(q[0]+4,q[1]+1,FISH[f].look.c1).set(q[0],q[1],C.ink);});}
  });
  if(i===0){const done=SPOTS.filter(sp=>sp.fish.every(f=>S.book[f.id])).length;for(let n=0;n<done;n++)S2.blit(medal(),108+n*14-done*7+7,34);}     // one medal per fishing spot whose Catch Log is complete
  return S2;
}

let acro=null;
function sparks(){

  for(let i=0;i<10;i++){const sp=document.createElement('i'),a=i/10*Math.PI*2;sp.className='spark';sp.style.left=x+'px';sp.style.top=y+'px';
    sp.style.setProperty('--dx',Math.cos(a)*62+'px');sp.style.setProperty('--dy',Math.sin(a)*62+'px');if(i%2)sp.style.background='#fffdf5';tl2.appendChild(sp);setTimeout(()=>sp.remove(),850);}

/* Finishing one task: a happy hop with a blush. */
function celebrateTask(){
  if(acro||tlBud.style.display==='none'||tab!=='today'||viewDay!==today())return;
  tlLive.opts={mood:'happy'};repaintBud();tlBud.classList.remove('hop');void tlBud.offsetWidth;tlBud.classList.add('hop');
  setTimeout(()=>{if(!acro){tlBud.classList.remove('hop');tlLive.opts={};renderToday();repaintBud();}},1150);
}
/* Finishing the whole day: tip onto the head, breakdance spin on the bar, flip back up. */
function stepAcro(now){
  const t=(now-acro.t0)/1000;let ty=0,rot=0,sx=1;
  const onHead=FEET-BH2+(B2Y+HEADTOP[tlLive.kind])*BSC;
  if(t<0.5){const k=t/0.5,e=k*k*(3-2*k);rot=180*e;ty=onHead*e-34*Math.sin(Math.PI*k);}
  else if(t<2.5){const k=(t-0.5)/2,turns=5.5*(k<0.5?2*k*k:1-2*(1-k)*(1-k));rot=180;ty=onHead+Math.sin(k*40)*1.2;sx=Math.cos(turns*Math.PI*2);
    if(Math.floor(k*14)!==acro.dust){acro.dust=Math.floor(k*14);dust();}}
  else if(t<3.05){const k=(t-2.5)/0.55,e=k*k*(3-2*k);rot=180+180*e;ty=onHead*(1-e)-38*Math.sin(Math.PI*k);}
  else if(t<4.3){const k=t-3.05;ty=-9*Math.abs(Math.sin(k*8))*Math.max(0,1-k/1.1);if(!acro.sparked){acro.sparked=true;sparks();}}
  else{acro=null;tlBud.style.transform='';tlLive.opts={};renderToday();repaintBud();return;}
  tlBud.style.transformOrigin='50% 50%';
  tlBud.style.transform='translateY('+ty.toFixed(1)+'px) rotate('+rot.toFixed(1)+'deg) scaleX('+sx.toFixed(3)+')';
  requestAnimationFrame(stepAcro);
}
function celebrateDay(){
  if(acro||tlBud.style.display==='none'||tab!=='today'||viewDay!==today())return;
  tlBud.classList.remove('hop');tlLive.opts={mood:'happy'};repaintBud();
  acro={t0:performance.now(),dust:-1};requestAnimationFrame(stepAcro);
}
/* A timed task that ran out without being ticked makes the buddy sleepy until the next task gets finished. */
function checkMisses(){

  liveTasksFor(t).forEach(x=>{
    if(x.start==null||now<x.start+x.len+GRACE)return;

}

  const t=S.set.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.set.theme;
  document.documentElement.setAttribute('data-theme',t);$('themeColor').setAttribute('content',t==='dark'?'#141a30':'#f6efdd');
}

/* ───────── 11. WELCOME ───────── */
let ob=null,obBusy=false;
function obGo(step,dir){
  if(obBusy||!ob)return;const old=document.querySelector('#ob .ob-body');
  if(!old){ob.step=step;renderOb(dir);return;}
  obBusy=true;old.className='ob-body out-'+dir;setTimeout(()=>{obBusy=false;if(!ob)return;ob.step=step;renderOb(dir);},140);
}
function renderOb(dir){
  const el=$('ob');el.hidden=false;
  let h='<div class="ob-in"><div class="ob-body'+(ob.step===0?' intro':'')+(dir?' in-'+dir:'')+'">';
  if(ob.step===0)h+='<h1>ScheduleBuddy</h1><div class="parade" id="parade"></div><p style="font-weight:700;font-size:17px">Plan your day and stick to it, with a little friend who earns rewards every time you do.</p>'
    +'<button class="btn" data-a="obNext" style="margin-top:8px">Get started</button>';
  else if(ob.step===1)h+='<h1>Pick your buddy</h1><p class="note">'+(S.migrated?'Your tasks and calendar came with you. ':'')+'They ride along your day and cheer when you get things done.</p><div class="buds" id="obBuds"></div>'
    +'<input class="field" id="obName" type="text" maxlength="16" placeholder="Name (optional)" value="'+esc(ob.name)+'" aria-label="Buddy name"><button class="btn" data-a="obNext">Continue</button><button class="btn c" data-a="obBack">Back</button>';
  else h+='<h1>How it works</h1><div class="panel how"><div id="how0"></div><div id="how1"></div><div id="how2"></div></div>'
    +'<p class="note">Worms pay for fishing trips, and the fish sell for more coins. Coins buy tackle, furniture and outfits. Take tickets to the arcade!</p><button class="btn" data-a="obDone">Start</button><button class="btn c" data-a="obBack">Back</button>';
  el.innerHTML=h+'</div></div>';el.scrollTop=0;
  if(ob.step===0){const cw=Math.min(innerWidth,440)-40,k=ps(Math.min(2.4,cw/2.98/B2W));KINDS.forEach((kind,i)=>{const cv=liveBuddy(kind,i===1?{hat:true}:{},k,$('parade'));cv.style.margin='0 '+(-Math.round(B2W*k*0.17))+'px';});}      // big, slightly overlapping, sized to fit the screen
  else if(ob.step===1)KINDS.forEach(k=>{const b=document.createElement('button');b.className='budpick'+(ob.kind===k?' on':'');b.dataset.a='obPick';b.dataset.v=k;b.setAttribute('aria-pressed',ob.kind===k);liveBuddy(k,{},ps(Math.min(2.4,(Math.min(innerWidth,440)-70)/2/B2W)),b);b.appendChild(document.createTextNode(KNAME[k]));$('obBuds').appendChild(b);});
  else [[coin(),'Every task you finish pays coins, up to '+TASK_CAP+' a day. Finish them all for '+DAY_BONUS+' more.'],[bait(),'Your first '+ONTIME_CAP+' on-time tasks each day earn a worm or an arcade ticket.'],[ticket(),'Finish everything in a day for '+DAY_TICKETS+' more tickets.']].forEach((r,i)=>{const box=document.createElement('span');box.className='howic';const cv=document.createElement('canvas');r[0].paint(cv);cv.style.width=(r[0].w*ps(2.5))+'px';cv.style.height=(r[0].h*ps(2.5))+'px';box.appendChild(cv);$('how'+i).appendChild(box);$('how'+i).appendChild(document.createTextNode(r[1]));});
}

/* ───────── 12. BACKUP ───────── */
async function exportData(){
  const name='schedulebuddy-backup-'+today()+'.json',text=JSON.stringify({app:'schedulebuddy',v:2,exportedAt:new Date().toISOString(),data:S});
  try{const f=new File([text],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'ScheduleBuddy backup'});S.lastBackup=Date.now();save();toast('Backup saved');if(tab==='today')renderToday();return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);S.lastBackup=Date.now();save();toast('Backup saved');if(tab==='today')renderToday();}catch(e){toast('Could not make the backup file');}
}
let pendingImport=null;
function importPicked(file){
  const r=new FileReader();r.onerror=()=>toast('Could not read that file');
  r.onload=()=>{
    let st=null;
    try{const o=JSON.parse(String(r.result));
      if(o&&o.app==='schedulebuddy'&&o.data)st=normalize(o.data);else if(o&&o.v===2&&Array.isArray(o.tasks))st=normalize(o);else if(looksOld(o)){const keep=S;st=migrateOld(o);S=keep;}}catch(e){}
    if(!st){toast('That file is not a ScheduleBuddy backup');return;}
    pendingImport=st;
    openSheet('<h2>Restore backup?</h2><p>'+st.tasks.length+(st.tasks.length===1?' task':' tasks')+' and '+Object.keys(st.log).length+' days of history. This replaces what is on this phone now.</p><button class="btn d" data-a="importGo">Restore</button><button class="btn c" data-a="close">Cancel</button>');
  };
  r.readAsText(file);
}

/* ───────── 13. BUTTONS AND TYPING ───────── */
function render(){if(!S.onboarded)return;({today:renderToday,adv:renderAdv,cal:renderCal,set:renderSet})[tab]();}
function goTab(t){
  tab=t;['today','adv','cal','set'].forEach(n=>$('t-'+n).classList.toggle('on',n===t));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===t));
  if(t==='today')scrolledFor='';
  render();
}
const ACT={
  tab(el){if(el.dataset.v==='today'){if(tab==='today')viewDay=today();scrolledFor='';}sfx('tap');goTab(el.dataset.v);},
  close(){closeSheet();},
  dayPop(el){dayPopup(el.dataset.k);},
  openDay(el){viewDay=el.dataset.k;scrolledFor='';closeSheet();goTab('today');},
  backToday(){viewDay=today();scrolledFor='';renderToday();},
  allTasks(){allTasksSheet();},
  sound(el){S.set.sound=el.dataset.v==='1';save();renderSet();sfx('done');},
  nudgeSave(){exportData();},
  nudgeLater(){S.nudgeAt=Date.now()+7*864e5;save();renderToday();},
  trayGo(){const sc=$('tscroll');sc.scrollTo({top:$('anytime').offsetTop-12,behavior:'smooth'});},
  addFor(el){const k=el.dataset.k;closeSheet();taskSheet(null,k);},
  addTask(){const t=today();taskSheet(null,viewDay>t&&tab==='today'?viewDay:undefined);},
  editTask(el){taskSheet(el.dataset.id);},
  check(el){
    const id=el.dataset.id,t=today(),k=el.dataset.k||t;if(k>t)return;
    const keepPop=popDay;
    const lg=logW(k);
    if(lg.done[id]){delete lg.done[id];settle(k);flush();renderWallet();if(keepPop){dayPopup(keepPop);renderCal();}else renderToday();return;}       // untick: its share is taken back
    const x=findTask(id,k);if(!x)return;
    if(k===t){if(x.start==null||nowMin()<=x.start+x.len+GRACE)complete(id,k,true);else askOnTime(id,k);}
    else if(k===addDays(t,-1))askOnTime(id,k);
    else complete(id,k,false);
  },
  onTimeYes(){const c=sheetCtx;closeSheet();if(c&&c.ask){popDay=c.back||null;complete(c.ask,c.k,true);}},
  onTimeNo(){const c=sheetCtx;closeSheet();if(c&&c.ask){popDay=c.back||null;complete(c.ask,c.k,false);}},
  seg(el){const g=el.parentNode;Array.prototype.forEach.call(g.children,b=>b.classList.toggle('on',b===el));
    if(sheetCtx){if(g.dataset.seg==='timed')sheetCtx.timed=el.dataset.v==='1';syncTaskSheet();}},
  len(el){if(!sheetCtx)return;sheetCtx.len=+el.dataset.v;sheetCtx.custom=false;Array.prototype.forEach.call(el.parentNode.children,b=>b.classList.toggle('on',b===el));syncTaskSheet();},
  lenCustom(el){if(!sheetCtx)return;sheetCtx.custom=true;Array.prototype.forEach.call(el.parentNode.children,b=>b.classList.toggle('on',b===el));$('tLen').value=sheetCtx.len;syncTaskSheet();$('tLen').focus();$('tLen').select();},
  togTimed(el){if(!sheetCtx)return;sheetCtx.timed=!sheetCtx.timed;el.classList.toggle('on',sheetCtx.timed);el.setAttribute('aria-checked',sheetCtx.timed);syncTaskSheet();},
  togRepeat(el){if(!sheetCtx)return;sheetCtx.repeat=sheetCtx.repeat==='days'?'once':'days';el.classList.toggle('on',sheetCtx.repeat==='days');el.setAttribute('aria-checked',sheetCtx.repeat==='days');syncTaskSheet();},
  pill(el){if(!sheetCtx)return;const d=+el.dataset.v,i=sheetCtx.days.indexOf(d);if(i>-1){if(sheetCtx.days.length===1)return;sheetCtx.days.splice(i,1);}else sheetCtx.days.push(d);
    el.classList.toggle('on',sheetCtx.days.includes(d));el.setAttribute('aria-pressed',sheetCtx.days.includes(d));},
  saveTask(){
    const c=sheetCtx;if(!c)return;const t=today();
    const name=$('tName').value.trim();if(!name){toast('Give it a name');$('tName').focus();return;}
    let start=null;if(c.timed){start=parseHM($('tStart').value);if(start==null){toast('Pick a start time');return;}}
    let date=null;if(c.repeat==='once'){date=$('tDate').value;if(!isKey(date)||date<t){toast('Pick today or a later date');return;}}
    if(c.timed&&c.custom){const v=Math.round(+$('tLen').value);if(!(v>=5&&v<=720)){toast('Length must be 5 to 720 minutes');$('tLen').focus();return;}c.len=v;}
    const len=c.timed?Math.min(c.len,1440-start):null;
    const x=c.id?S.tasks.find(q=>q.id===c.id):null;
    if(x){x.name=name.slice(0,60);x.start=start;x.len=len;x.repeat=c.repeat;x.days=c.repeat==='days'?c.days.slice():[];x.date=date;}
    else S.tasks.push({id:'t'+uid(),name:name.slice(0,60),start:start,len:len,repeat:c.repeat,days:c.repeat==='days'?c.days.slice():[],date:date,created:t,ended:null});
    settle(t);flush();closeSheet();renderWallet();render();toast(x?'Saved':'Task added');
  },
  delTask(){const c=sheetCtx;if(!c||!c.id)return;const x=S.tasks.find(q=>q.id===c.id);if(!x)return closeSheet();
    openSheet('<h2>Delete this task?</h2><p>'+esc(x.name)+' will stop appearing from today on. Past days keep their record.</p><button class="btn d" data-a="delTaskGo">Delete</button><button class="btn c" data-a="close">Cancel</button>');sheetCtx=c;},
  delTaskGo(){
    const c=sheetCtx;if(!c||!c.id)return closeSheet();const t=today(),x=S.tasks.find(q=>q.id===c.id);
    if(x){if(x.repeat==='once'||x.created===t)S.tasks=S.tasks.filter(q=>q!==x);else x.ended=t;}
    if(S.log[t])delete S.log[t].done[c.id];
    settle(t);flush();closeSheet();renderWallet();render();toast('Deleted');
  },
  calPrev(){calM--;if(calM<0){calM=11;calY--;}renderCal();},
  calNext(){calM++;if(calM>11){calM=0;calY++;}renderCal();},
  pickBuddy(el){S.buddy=el.dataset.v;tlLive.kind=S.buddy;save();renderSet();},
  hours(el){const v=el.dataset.v.split(',').map(Number);S.set.dayStart=v[0];S.set.dayEnd=v[1];scrolledFor='';save();renderSet();},
  theme(el){S.set.theme=el.dataset.v;applyTheme();save();renderSet();},
  export(){exportData();},
  import(){const f=$('importFile');f.value='';f.click();},
  importGo(){const st=pendingImport;pendingImport=null;if(!st)return closeSheet();st.onboarded=true;S=st;advDefaults();homeDefaults();arcDefaults();rollDays();adoptRewards();flush();closeSheet();applyTheme();viewDay=today();tlLive.kind=S.buddy;lastHomeKey='';renderWallet();goTab('today');toast('Backup restored');},
  clearAsk(){openSheet('<h2>Clear all data?</h2><p>Erases your tasks, calendar and everything you have earned. Other apps are not affected. This cannot be undone.</p><button class="btn d" data-a="clearGo">Clear all data</button><button class="btn c" data-a="close">Cancel</button>');},
  clearGo(){try{localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY);}catch(e){}S=null;clearTimeout(saveT);location.reload();},     // only ScheduleBuddy's own two entries are removed
  obPick(el){ob.kind=el.dataset.v;ob.name=$('obName').value;document.querySelectorAll('#obBuds .budpick').forEach(b=>{b.classList.toggle('on',b===el);b.setAttribute('aria-pressed',b===el);});},
  obNext(){if($('obName'))ob.name=$('obName').value.trim();obGo(ob.step+1,'fwd');},
  obBack(){if($('obName'))ob.name=$('obName').value.trim();obGo(ob.step-1,'back');},
  obDone(){
    if(obBusy||!ob)return;S.buddy=ob.kind;S.name=ob.name.slice(0,16);S.onboarded=true;flush();const gift=S.migrated?S.gift:0;ob=null;
    startApp();const el=$('ob');el.classList.add('leaving');setTimeout(()=>{el.hidden=true;el.innerHTML='';el.classList.remove('leaving');if(gift>0)toast('Welcome back! Your old level became '+gift+' coins');},300);
  }
};
Object.assign(ACT,ADV_ACT,HOME_ACT,ARC_ACT);
[['arcL','l'],['arcR','r'],['arcA','a']].forEach(b=>{const el=$(b[0]);
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('down');arcKey(b[1],true);});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>{el.classList.remove('down');arcKey(b[1],false);}));});
$('arcC').addEventListener('pointerdown',e=>{e.preventDefault();arcKey('a',true);});
document.addEventListener('keydown',e=>{if(!A)return;if(e.key==='ArrowLeft')arcKey('l',true);if(e.key==='ArrowRight')arcKey('r',true);if(e.key===' '||e.key==='Enter'){e.preventDefault();arcKey('a',true);}});
document.addEventListener('keyup',e=>{if(!A)return;if(e.key==='ArrowLeft')arcKey('l',false);if(e.key==='ArrowRight')arcKey('r',false);});
document.addEventListener('click',ev=>{
  if(ev.target===$('sheet')){closeSheet();return;}
  const el=ev.target.closest&&ev.target.closest('[data-a]');if(!el||el.disabled)return;
  const fn=ACT[el.dataset.a];if(fn)fn(el,ev);
});
document.addEventListener('input',ev=>{const el=ev.target,k=el.dataset&&el.dataset.i;if(k==='budName'){S.name=el.value.slice(0,16);save();}});
document.addEventListener('change',ev=>{
  const el=ev.target,k=el.dataset&&el.dataset.i;
  if(el.id==='importFile'){if(el.files&&el.files[0])importPicked(el.files[0]);return;}
  if(k==='dayStart'||k==='dayEnd'){
    let a=k==='dayStart'?+el.value:S.set.dayStart,b=k==='dayEnd'?+el.value:S.set.dayEnd;
    if(b-a<120){if(k==='dayStart')b=Math.min(1440,a+120);else a=Math.max(0,b-120);}
    S.set.dayStart=a;S.set.dayEnd=b;save();renderSet();
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&sheetOpen())closeSheet();if(ev.key==='Enter'&&ev.target.id==='tName')ACT.saveTask();});
/* No zooming. A second tap landing within a third of a second on anything that is not a control is swallowed, which is what triggers double-tap zoom. */
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now(),quick=now-lastTouchEnd<350;lastTouchEnd=now;
  if(quick&&e.cancelable&&!(e.target.closest&&e.target.closest('button,input,select,textarea,a,[data-a],#game,#arcDev')))e.preventDefault();},{passive:false});
document.addEventListener('dblclick',e=>{e.preventDefault();},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

$('game').addEventListener('pointerdown',gamePointer);$('game').addEventListener('pointermove',gamePointer);
/* The clock: every 20 seconds, and whenever the app comes back to the front. */
function heartbeat(){
  if(!S||!S.onboarded)return;
  const t=today();let fresh2=false;
  if(t!==lastToday){if(viewDay===lastToday)viewDay=t;lastToday=t;rollDays();scrolledFor='';fresh2=true;}
  const missed=checkMisses();
  if(tab==='today'&&!sheetOpen()&&!acro)renderToday();else if(tab==='today')drawSky();
  if((fresh2||missed)&&tab!=='today')render();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S)flush();}else heartbeat();});
window.addEventListener('pagehide',()=>{if(S)flush();});
window.addEventListener('resize',()=>{if(S&&S.onboarded&&tab==='today')renderToday();});
$('tscroll').addEventListener('scroll',()=>{if(S&&S.onboarded)trayHint();},{passive:true});

/* ───────── 14. START-UP ───────── */
function startApp(){
  $('app').hidden=false;
  const nav=$('nav');nav.innerHTML='';
  [['today','today','Today'],['adv','map','Adventure'],['cal','cal','Calendar'],['set','gear','Settings']].forEach(n=>{const b=document.createElement('button');b.dataset.a='tab';b.dataset.v=n[0];const cv=document.createElement('canvas');icon(n[1]).paint(cv);b.appendChild(cv);b.appendChild(document.createTextNode(n[2]));nav.appendChild(b);});
  sun().paint($('sunC'));moon().paint($('moonC'));
  if(!document.querySelector('.star'))for(let i=0;i<34;i++){const st=document.createElement('i');st.className='star';st.style.left=((i*61+13)%97)+'%';st.style.top=((i*37+7)%88)+'%';if(i%3===0){st.style.width='2px';st.style.height='2px';}$('sky').appendChild(st);}
  tlLive.kind=S.buddy;advDefaults();homeDefaults();arcDefaults();rollDays();adoptRewards();settle(today());checkMisses();
  renderWallet();viewDay=today();goTab('today');
}
load();applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S)applyTheme();});}catch(e){}

setInterval(animate,140);setInterval(heartbeat,20000);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
